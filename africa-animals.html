<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anas Ahmed — Africa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --panel: rgba(28,20,11,.74); --fg: #f3e6c8; --ac: #e2ad55; --line: rgba(243,230,200,.22); box-sizing: border-box }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #8fb1c9; font-family: Poppins, system-ui, sans-serif; color: var(--fg) }
    .p { position: absolute; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px) }
    #id { top: 10px; left: 10px; padding: 8px 14px }
    #id b { font-size: 1.05rem; letter-spacing: .06em }
    #id span { display: block; font-size: .72rem; opacity: .8 }
    #side { top: 10px; right: 10px; padding: 8px; width: 236px }
    #mini { display: block; width: 220px; height: 220px; border-radius: 6px; cursor: pointer }
    #bar { left: 50%; transform: translateX(-50%); bottom: 10px; padding: 7px 14px; font-size: .76rem; display: flex; gap: 14px; align-items: center; white-space: nowrap }
    kbd { background: rgba(255,255,255,.14); border-radius: 4px; padding: 1px 6px; font: 700 .72rem Poppins }
    #loc { left: 10px; top: 62px; padding: 5px 12px; font-size: .78rem; color: var(--ac); font-weight: 600 }
    #map { position: fixed; inset: 0; z-index: 50; background: rgba(10,8,5,.82); display: none; align-items: center; justify-content: center }
    #map.on { display: flex }
    #mc { width: min(92vw, 86vh); height: min(92vw, 86vh); border-radius: 12px; border: 2px solid var(--ac); cursor: pointer }
    #ld { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; background: #dfe9ee; color: #2b4152; font-weight: 600; transition: opacity .9s }
    #status { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 8px 16px; background: rgba(0,0,0,.7); border-radius: 8px; font-size: .75rem; display: none }
    @media(max-width:700px) { #bar span.h { display: none } #side { width: auto } #mini { width: 110px; height: 110px } }
  </style>
</head>
<body>
  <div id="id" class="p"><b>AFRICA</b><span>by Anas Ahmed</span></div>
  <div id="loc" class="p">South Africa</div>
  <div id="side" class="p"><canvas id="mini" width="320" height="320"></canvas></div>
  <div id="bar" class="p">
    <span class="h"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span class="h"><b>click</b> ground · <kbd>Shift</kbd> run · drag look · scroll zoom</span>
    <span><kbd>M</kbd> map</span>
  </div>
  <div id="map"><canvas id="mc" width="1400" height="1400"></canvas></div>
  <div id="ld">Growing Africa…</div>
  <div id="status"></div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    /* =========================================================
       SEEDED RANDOM
       ========================================================= */
    const TAU = Math.PI * 2;
    let _seed = 11;
    const rnd = () => (_seed = _seed * 16807 % 2147483647) / 2147483647;
    const hs = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
    const vnoise = (x, y) => {
      const i = Math.floor(x), j = Math.floor(y);
      const u = x - i, v = y - j;
      const s = u * u * (3 - 2 * u), t = v * v * (3 - 2 * v);
      return hs(i, j) * (1 - s) * (1 - t)
        + hs(i + 1, j) * s * (1 - t)
        + hs(i, j + 1) * (1 - s) * t
        + hs(i + 1, j + 1) * s * t;
    };
    const fbm = (x, y, o = 5) => {
      let a = .5, f = 1, s = 0;
      for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= .5; }
      return s;
    };
    const smooth = (a, b, x) => {
      x = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return x * x * (3 - 2 * x);
    };

    /* =========================================================
       CANVAS / TEXTURE HELPERS
       ========================================================= */
    const canvas2D = (w, h = w) => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return [c, c.getContext('2d')];
    };
    const texFromCanvas = (c, rep = 1, aniso = 8) => {
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = aniso;
      if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); }
      return t;
    };
    const normalFromHeight = (c, strength = 2) => {
      const S = c.width;
      const g = c.getContext('2d');
      const im = g.getImageData(0, 0, S, S).data;
      const [c2, g2] = canvas2D(S, S);
      const out = g2.createImageData(S, S);
      const hgt = (x, y) => im[(((y + S) % S) * S + ((x + S) % S)) * 4] / 255;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const dx = (hgt(x + 1, y) - hgt(x - 1, y)) * strength;
        const dy = (hgt(x, y + 1) - hgt(x, y - 1)) * strength;
        const l = Math.hypot(dx, dy, 1);
        const i = (y * S + x) * 4;
        out.data[i] = (-dx / l * .5 + .5) * 255;
        out.data[i + 1] = (-dy / l * .5 + .5) * 255;
        out.data[i + 2] = (1 / l) * 255;
        out.data[i + 3] = 255;
      }
      g2.putImageData(out, 0, 0);
      const t = new THREE.CanvasTexture(c2);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      return t;
    };

    /* =========================================================
       WORLD CONSTANTS — SCALED UP
       ========================================================= */
    const WS = 2.5;
    const E = 3000 * WS;
    const RW = Math.sqrt(WS);
    const N = n => Math.round(n * WS * 1.6);

    const AFRICA_BLOBS = [
      [ 100, -1700, 1050, 550, 1.0],
      [-200, -1600, 700, 500, 1.0],
      [ 400, -1600, 550, 475, 1.0],
      [ 650, -1500, 400, 425, 1.0],
      [ 50, -1300, 1050, 475, 1.0],
      [-275, -700, 550, 400, 1.0],
      [-525, -300, 400, 325, 1.0],
      [-475, 100, 375, 300, 1.0],
      [-350, 325, 375, 300, 1.0],
      [-125, -250, 475, 375, 1.0],
      [ 150, -100, 400, 350, 1.0],
      [ 250, 350, 425, 350, 1.0],
      [ 300, 750, 350, 325, 1.0],
      [ 75, 575, 300, 300, 1.0],
      [ 675, -650, 375, 275, 1.0],
      [ 875, -350, 250, 200, 1.0],
      [ 1050, -200, 250, 175, 1.0],
      [ 1200, -300, 175, 125, 1.0],
      [ 825, 250, 300, 275, 1.0],
      [ 750, 675, 325, 350, 1.0],
      [ 450, 1200, 400, 350, 1.0],
      [ 550, 1675, 350, 325, 1.0],
      [ 400, 2075, 300, 300, 1.0],
      [ 375, 2525, 275, 275, 1.0],
      [ 1225, 1350, 150, 350, 1.0]
    ];

    const MOUNTAINS = [
      [-225, -1650, 275, 100, 1.2],
      [-75, -1600, 225, 90, 1.1],
      [ 125, -1550, 175, 75, 1.0],
      [ 250, -1175, 125, 125, 1.0],
      [ 400, -675, 150, 125, 1.0],
      [ 975, -275, 175, 125, 1.3],
      [1050, -100, 125, 100, 1.1],
      [ 750, 300, 125, 175, 1.1],
      [ 825, 275, 75, 75, 1.0],
      [ 850, 575, 75, 75, 1.2],
      [ 500, 2475, 150, 175, 1.4],
      [ 400, 2325, 100, 125, 1.1],
      [ 250, 300, 75, 100, 0.9],
      [ 275, 2150, 100, 150, 0.8],
      [ 675, -425, 100, 75, 0.9]
    ];

    const RIVERS = [
      { name: 'NILE', pts: [[825,500],[775,250],[725,0],[675,-275],[625,-600],[575,-950],[525,-1250],[475,-1550],[450,-1750]] },
      { name: 'BLUE NILE', pts: [[975,-250],[875,-325],[775,-400],[675,-575]] },
      { name: 'CONGO', pts: [[375,700],[310,775],[225,850],[125,875],[25,825],[-75,750],[-190,700]] },
      { name: 'NIGER', pts: [[-525,125],[-475,0],[-375,-200],[-275,-350],[-200,-500],[-100,-400],[0,-125],[125,60]] },
      { name: 'SENEGAL', pts: [[-575,-225],[-525,-150],[-450,-75],[-375,0]] },
      { name: 'ZAMBEZI', pts: [[475,1325],[550,1450],[625,1600],[650,1800],[625,2050]] },
      { name: 'ORANGE', pts: [[425,2400],[375,2525],[325,2650],[300,2750]] },
      { name: 'LIMPOPO', pts: [[450,2150],[525,2200],[575,2275]] },
      { name: 'VOLTA', pts: [[-375,100],[-400,200],[-425,300],[-450,375]] },
      { name: 'OKAVANGO', pts: [[425,1600],[375,1800],[350,2000],[325,2125]] },
      { name: 'TIGRIS', pts: [[875,-250],[825,-200],[775,-150],[750,-100]] },
      { name: 'JUBBA', pts: [[1050,-300],[1000,-200],[950,-100],[900,0]] }
    ];

    const FORESTS = [
      [ 225, 550, 350, 275],
      [ 75, 700, 225, 200],
      [-375, 125, 225, 150],
      [1225, 1325, 125, 275]
    ];

    const DESERTS = [
      [ 50, -1300, 1100, 525],
      [ 375, 2150, 300, 275],
      [ 225, 2400, 125, 250]
    ];

    const SAVANNA = [
      [-250, -375, 625, 500],
      [ 250, 125, 500, 375],
      [ 625, 1000, 500, 500]
    ];

    const COUNTRIES = [
      ['MOROCCO', -200, -1650], ['ALGERIA', 125, -1600], ['TUNISIA', 325, -1525],
      ['LIBYA', 375, -1350], ['EGYPT', 650, -1425], ['W. SAHARA', -400, -1500],
      ['MAURITANIA', -350, -1000], ['MALI', -200, -750], ['SENEGAL', -550, -375],
      ['GAMBIA', -540, -275], ['GUINEA-BISSAU', -510, -200], ['GUINEA', -475, -125],
      ['SIERRA LEONE', -450, -50], ['LIBERIA', -425, 50], ['IVORY COAST', -400, 125],
      ['BURKINA FASO', -250, 100], ['GHANA', -350, 225], ['TOGO', -325, 275], ['BENIN', -300, 310],
      ['NIGERIA', -150, 275], ['NIGER', 0, -275], ['CHAD', 250, -125],
      ['CAMEROON', 100, 275], ['C.A.R.', 325, 150], ['EQ. GUINEA', 50, 425],
      ['GABON', 110, 525], ['CONGO', 175, 625], ['DR CONGO', 375, 775], ['ANGOLA', 400, 1325],
      ['SUDAN', 675, -700], ['S. SUDAN', 675, -250], ['ETHIOPIA', 1025, -225],
      ['ERITREA', 975, -425], ['DJIBOUTI', 1100, -275], ['SOMALIA', 1250, -325],
      ['KENYA', 850, 250], ['UGANDA', 750, 100], ['RWANDA', 650, 375], ['BURUNDI', 650, 450],
      ['TANZANIA', 775, 700], ['MALAWI', 725, 975], ['MOZAMBIQUE', 725, 1575],
      ['ZAMBIA', 500, 1250], ['ZIMBABWE', 575, 1625], ['BOTSWANA', 425, 2050],
      ['NAMIBIA', 300, 2175], ['SOUTH AFRICA', 400, 2550], ['LESOTHO', 425, 2500],
      ['ESWATINI', 525, 2450], ['MADAGASCAR', 1225, 1325]
    ];

    /* =========================================================
       APPLY WORLD SCALE TO GEOGRAPHY DATA
       ========================================================= */
    (function applyWorldScale() {
      AFRICA_BLOBS.forEach(b => { b[0] *= WS; b[1] *= WS; b[2] *= WS; b[3] *= WS; });
      MOUNTAINS.forEach(m => { m[0] *= WS; m[1] *= WS; m[2] *= WS; m[3] *= WS; });
      RIVERS.forEach(r => r.pts.forEach(p => { p[0] *= WS; p[1] *= WS; }));
      [FORESTS, DESERTS, SAVANNA].forEach(a => a.forEach(r => { r[0] *= WS; r[1] *= WS; r[2] *= WS; r[3] *= WS; }));
      COUNTRIES.forEach(c => { c[1] *= WS; c[2] *= WS; });
    })();

    /* =========================================================
       GEOGRAPHY FUNCTIONS
       ========================================================= */
    function inRegion(x, z, regions) {
      for (const [cx, cz, rx, rz] of regions) {
        const d = Math.hypot((x - cx) / rx, (z - cz) / rz);
        if (d < 1) return 1 - d;
      }
      return 0;
    }

    function landMask(x, z) {
      let s = -1;
      for (const [cx, cz, rx, rz, w] of AFRICA_BLOBS) {
        const d = 1 - Math.hypot((x - cx) / rx, (z - cz) / rz);
        s = Math.max(s, d * w);
      }
      s += (fbm(x * .0025 / WS, z * .0025 / WS, 4) - .5) * .28;
      return s;
    }

    function riverDistance(x, z) {
      let best = 1e9;
      for (const river of RIVERS) {
        const line = river.pts;
        for (let i = 0; i < line.length - 1; i++) {
          const a = line[i], b = line[i + 1];
          const dx = b[0] - a[0], dz = b[1] - a[1];
          const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (z - a[1]) * dz) / (dx * dx + dz * dz)));
          const d = Math.hypot(x - a[0] - t * dx, z - a[1] - t * dz);
          if (d < best) best = d;
        }
      }
      return best;
    }

    const DEPRESSIONS = [[250, 650, 275, 225, 1.5], [150, -275, 225, 175, 1.0]]
      .map(([a, b, c, d, k]) => [a * WS, b * WS, c * WS, d * WS, k]);

    function heightAt(x, z) {
      const s = landMask(x, z);
      if (s <= 0) return Math.max(s * 80, -40);
      const k3 = Math.min(1, s * 3);
      let h = Math.min(s * 18, 8)
        + (fbm(x * .002 / WS, z * .002 / WS, 4) - .5) * 12 * k3
        + (fbm(x * .008, z * .008, 3) - .5) * 3 * k3
        + (fbm(x * .03, z * .03, 2) - .5) * 1.1 * k3;

      const mh = 90 * Math.sqrt(WS) * Math.min(1, s * 2);
      for (const [mx, mz, rx, rz, k] of MOUNTAINS) {
        const dx = (x - mx) / rx, dz = (z - mz) / rz, r2 = dx * dx + dz * dz;
        if (r2 < 1) {
          const m = 1 - r2;
          h += k * m * m * (3 - 2 * m) * mh * (.7 + .6 * fbm(x * .012, z * .012, 3)); // ridged/eroded
        }
      }
      for (const [cx, cz, rx, rz, k] of DEPRESSIONS) {
        const m = Math.max(0, 1 - Math.hypot((x - cx) / rx, (z - cz) / rz));
        h -= k * m * m * 12;
      }
      if (h < 60) {
        const rd = riverDistance(x, z);
        if (rd < 40 * RW) { const k = smooth(10 * RW, 40 * RW, rd); h = h * k + (-1.5) * (1 - k); }
      }
      return Math.max(h, -1.5);
    }

    function isDesert(x, z) { return inRegion(x, z, DESERTS) > .3; }
    function isForest(x, z) { return inRegion(x, z, FORESTS) > .3; }
    function isSavanna(x, z) { return inRegion(x, z, SAVANNA) > .2; }

    /* =========================================================
       REALISTIC TERRAIN COLOUR
       ========================================================= */
    function groundColor(x, z, h, ny = 1) {
      const n = fbm(x * .02, z * .02, 3);
      const f = fbm(x * .002 + 7, z * .002, 3);
      const dry = fbm(x * .006 + 11, z * .006, 3);
      const macro = 1 + (fbm(x * .0007 + 3, z * .0007, 2) - .5) * .35;
      const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];

      if (h < -1) {
        const k = smooth(0, 30, -h);
        return [.20 - .14 * k + .02 * n, .30 - .20 * k + .02 * n, .24 - .13 * k];
      }
      let c;
      if (h < 4) {
        c = mix([.30, .25, .17], [.74, .64, .44], smooth(.1, 3.5, h));      // wet -> dry sand
        c = c.map(v => v * (1 + (n - .5) * .18));
      } else {
        const desert = inRegion(x, z, DESERTS), forest = inRegion(x, z, FORESTS), sv = inRegion(x, z, SAVANNA);
        if (desert > 0) {
          const ripple = Math.sin((x * .6 + z * .35) * .05 + n * 7) * .035;   // dune ripples
          const d = .60 + n * .12 + ripple - desert * .05;
          c = [d + .15, d * .80 + .03, d * .55];
        } else if (forest > .2) {
          const dk = smooth(.3, .7, f) * .65;
          const gr = [.10 + n * .08, .24 + n * .10, .05 + n * .03].map(v => v * (1 - .4 * dk));
          c = mix(gr, [.36, .34, .14], smooth(.9, .5, forest));
        } else if (sv > .1) {
          const d = .44 + n * .10;
          c = mix([d, d * .86 + .02, d * .40], [.24, .34, .10], smooth(.5, .7, dry) * .5);
        } else {
          c = mix([.17 + n * .10, .29 + n * .12, .09 + n * .05], [.40, .38, .16], smooth(.55, .78, dry));
        }
        c = c.map(v => v * macro);
        const rockK = Math.max(smooth(.86, .62, ny), smooth(90, 170, h) * .8);
        const rb = .34 + .08 * Math.sin(h * .25 + f * 6) + n * .10;
        c = mix(c, [rb * 1.05, rb, rb * .9], rockK);
        const snowK = smooth(150, 190, h + (n - .5) * 30) * smooth(.55, .85, ny);
        c = mix(c, [.92, .94, .97], snowK);
      }
      return c;
    }

    /* =========================================================
       RENDERER / SCENE / LIGHTS
       ========================================================= */
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 2, 90000);
    camera.position.set(400 * WS - 900, 900, 2550 * WS + 1800);

    const controls = new OrbitControls(camera, renderer.domElement);
    Object.assign(controls, {
      enableDamping: true,
      dampingFactor: .06,
      maxPolarAngle: Math.PI / 2.05,
      minDistance: 80,
      maxDistance: 45000,
      enablePan: false
    });
    controls.target.set(400 * WS, 5, 2550 * WS);

    const sky = new Sky();
    sky.scale.setScalar(60000);
    const skyU = sky.material.uniforms;
    skyU.turbidity.value = 2.6;
    skyU.rayleigh.value = 2.2;
    skyU.mieCoefficient.value = .004;
    skyU.mieDirectionalG.value = .84;
    const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(56), THREE.MathUtils.degToRad(150));
    skyU.sunPosition.value.copy(sunDir);
    scene.add(sky);

    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(sky).texture;
    scene.environmentIntensity = 0.42;
    scene.fog = new THREE.FogExp2(0xa9c0d4, .00003);

    scene.add(new THREE.HemisphereLight(0xcfe3f5, 0x3a4528, 0.35));
    const sun = new THREE.DirectionalLight(0xffe4b8, 3.0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -1500, right: 1500, top: 1500, bottom: -1500, near: 1, far: 6000 });
    sun.shadow.bias = -.0003;
    sun.shadow.normalBias = 4.0;
    scene.add(sun, sun.target);

    const statusEl = document.getElementById('status');
    const showStatus = (msg, d = 4000) => {
      statusEl.textContent = msg;
      statusEl.style.display = 'block';
      clearTimeout(statusEl._timer);
      statusEl._timer = setTimeout(() => statusEl.style.display = 'none', d);
    };

    /* =========================================================
       TEXTURES
       ========================================================= */
    const noiseTex = (base, cols, count, rep, sz = 256) => {
      const [c, g] = canvas2D(sz);
      g.fillStyle = base;
      g.fillRect(0, 0, sz, sz);
      for (let i = 0; i < count; i++) {
        g.fillStyle = cols[i % cols.length];
        g.globalAlpha = .06 + rnd() * .14;
        g.beginPath();
        g.arc(rnd() * sz, rnd() * sz, 1 + rnd() * 5, 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
      return texFromCanvas(c, rep);
    };

    const detailTex = noiseTex('#ffffff', ['#d8d8d8', '#bdbdbd', '#efefef', '#a8a8a8'], 2600, 1800 * WS);

    const [barkC, barkG] = canvas2D(512);
    barkG.fillStyle = '#54422e';
    barkG.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 150; i++) {
      const x0 = rnd() * 512;
      const amp = 2 + rnd() * 5;
      const per = 50 + rnd() * 90;
      const ph = rnd() * TAU;
      const w = 2 + rnd() * 7;
      const light = rnd() < .45;
      barkG.strokeStyle = light ? `rgba(148,118,88,${.25 + rnd() * .3})` : `rgba(34,24,15,${.3 + rnd() * .4})`;
      barkG.lineWidth = w;
      barkG.beginPath();
      for (let y = 0; y <= 512; y += 16) {
        const x = x0 + Math.sin(y / per * TAU + ph) * amp;
        if (y === 0) barkG.moveTo(x, y);
        else barkG.lineTo(x, y);
      }
      barkG.stroke();
    }
    const barkTex = texFromCanvas(barkC, 1);

    const leafCardTex = (() => {
      const [c, g] = canvas2D(256);
      const palettes = [['#2c5417', '#4c8226'], ['#37661d', '#5d9a2e'], ['#416f22', '#6fae3a']];
      for (let i = 0; i < 80; i++) {
        const a = rnd() * TAU;
        const r = Math.sqrt(rnd()) * 104;
        const x = 128 + Math.cos(a) * r;
        const y = 128 + Math.sin(a) * r;
        const L = 30 + rnd() * 26;
        const W = 8 + rnd() * 7;
        g.save();
        g.translate(x, y);
        g.rotate(rnd() * TAU);
        const grad = g.createLinearGradient(0, 0, 0, -L);
        grad.addColorStop(0, palettes[i % 3][0]);
        grad.addColorStop(1, palettes[i % 3][1]);
        g.fillStyle = grad;
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(W, -L * .35, 0, -L);
        g.quadraticCurveTo(-W, -L * .35, 0, 0);
        g.fill();
        g.restore();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    const leafTex = noiseTex('#3f6d24', ['#2c4d18', '#55882e', '#6fa03a', '#24421a'], 1600, 8);

    const frondTex = (() => {
      const [c, g] = canvas2D(128, 512);
      const grad = g.createLinearGradient(0, 512, 0, 0);
      grad.addColorStop(0, '#6a7a34');
      grad.addColorStop(1, '#3f6d2a');
      g.strokeStyle = grad;
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(64, 512);
      g.quadraticCurveTo(64, 260, 64, 6);
      g.stroke();
      const cols = ['#33591d', '#3f6d24', '#4a7d2a', '#578f31'];
      for (let i = 0; i < 52; i++) {
        const t2 = i / 52;
        const y = 500 - t2 * 486;
        const L = 56 * Math.sin(Math.min(1, t2 * 1.15) * 2.4) + 8;
        for (const s of [-1, 1]) {
          const lg = g.createLinearGradient(64, y, 64 + s * L, y + L * .5);
          lg.addColorStop(0, cols[i % 4]);
          lg.addColorStop(1, '#69a03c');
          g.strokeStyle = lg;
          g.lineWidth = 3.4;
          g.beginPath();
          g.moveTo(64, y);
          g.quadraticCurveTo(64 + s * L * .55, y - 6, 64 + s * L, y + L * .5);
          g.stroke();
        }
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    const grassTex = (() => {
      const [c, g] = canvas2D(64, 128);
      for (let i = 0; i < 26; i++) {
        const x = 5 + rnd() * 54;
        const l = 46 + rnd() * 76;
        const bend = (rnd() - .5) * 34;
        const dry = rnd() < .45;
        const grad = g.createLinearGradient(x, 128, x + bend, 128 - l);
        const greens = ['#2c4a18', '#33551c', '#3d6420'];
        grad.addColorStop(0, dry ? '#8a6e2c' : greens[i % 3]);
        grad.addColorStop(.6, dry ? '#b89a4a' : '#5c8a2c');
        grad.addColorStop(1, dry ? '#d8c070' : '#8ab04a');
        g.strokeStyle = grad;
        g.lineWidth = 1.4 + rnd() * 1.6;
        g.beginPath();
        g.moveTo(x, 128);
        g.quadraticCurveTo(x + bend * .3, 128 - l * .6, x + bend, 128 - l);
        g.stroke();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    const [rockC, rockG] = canvas2D(512);
    rockG.fillStyle = '#7b766c';
    rockG.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 260; i++) {
      const v = 90 + rnd() * 90;
      rockG.fillStyle = `rgba(${v},${v * .98},${v * .92},.12)`;
      rockG.beginPath();
      rockG.arc(rnd() * 512, rnd() * 512, 4 + rnd() * 26, 0, TAU);
      rockG.fill();
    }
    const rockTex = texFromCanvas(rockC, 6);

    const clothTex = noiseTex('#ffffff', ['#e8e8e8', '#cfcfcf', '#f5f5f5'], 900, 6);

    const terrainNrm = (() => {
      const [c, g] = canvas2D(256);
      g.fillStyle = '#808080';
      g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 900; i++) {
        g.fillStyle = rnd() < .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.10)';
        g.beginPath();
        g.arc(rnd() * 256, rnd() * 256, 1 + rnd() * 4, 0, TAU);
        g.fill();
      }
      const t = normalFromHeight(c, 1.4);
      t.repeat.set(2000 * WS, 2000 * WS);
      return t;
    })();

    const waterNrm = (() => {
      const S = 256;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      const img = g.createImageData(S, S);
      const a = TAU / S;
      const hh = (x, y) =>
        Math.sin(x * a * 4 + Math.sin(y * a * 2) * 2) +
        Math.sin(y * a * 6 + x * a) * .5 +
        Math.sin((x + y) * a * 8) * .3 +
        Math.sin((x - y) * a * 13) * .15;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const dx = hh(x + 1, y) - hh(x - 1, y);
        const dy = hh(x, y + 1) - hh(x, y - 1);
        const i = (y * S + x) * 4;
        img.data[i] = 128 - dx * 40;
        img.data[i + 1] = 128 - dy * 40;
        img.data[i + 2] = 255;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(4800, 4800);
      return t;
    })();

    const cloudTex = (() => {
      const [c, g] = canvas2D(256);
      for (let i = 0; i < 16; i++) {
        const x = 128 + (rnd() - .5) * 130;
        const y = 120 + (rnd() - .5) * 60 - i * 1.5;
        const r = 40 + rnd() * 55;
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(255,255,255,.42)');
        grad.addColorStop(.7, 'rgba(250,250,252,.18)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grad;
        g.beginPath();
        g.arc(x, y, r, 0, TAU);
        g.fill();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    const birdTex = (() => {
      const [c, g] = canvas2D(64, 32);
      g.strokeStyle = 'rgba(30,30,34,.9)';
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(4, 20);
      g.quadraticCurveTo(18, 6, 32, 16);
      g.quadraticCurveTo(46, 6, 60, 20);
      g.stroke();
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    /* =========================================================
       TERRAIN
       ========================================================= */
    const SEG = 1500;
    const terrainGeo = new THREE.PlaneGeometry(E * 2, E * 2, SEG, SEG);
    terrainGeo.rotateX(-Math.PI / 2);
    {
      const pos = terrainGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
      }
      terrainGeo.computeVertexNormals();
      const norm = terrainGeo.attributes.normal;
      const colors = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const c = groundColor(pos.getX(i), pos.getZ(i), pos.getY(i), norm.getY(i));
        colors.set(c, i * 3);
      }
      terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }
    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      map: detailTex,
      normalMap: terrainNrm,
      normalScale: new THREE.Vector2(.8, .8),
      roughness: .96
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    /* =========================================================
       OCEAN
       ========================================================= */
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x0a4466, roughness: .12, metalness: 0,
      clearcoat: 1, clearcoatRoughness: .12,
      transparent: true, opacity: .93,
      normalMap: waterNrm, normalScale: new THREE.Vector2(.9, .9),
      envMapIntensity: 1.2
    });
    const water = new THREE.Mesh(new THREE.PlaneGeometry(60000, 60000), waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -.1;
    scene.add(water);

    /* =========================================================
       RIVER MESHES
       ========================================================= */
    {
      const riverMat = new THREE.MeshStandardMaterial({
        color: 0x2a7ab8, emissive: 0x1a4a78, emissiveIntensity: 0.15,
        roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.9
      });
      RIVERS.forEach(river => {
        const pts = river.pts;
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2;
          const dx = b[0] - a[0], dz = b[1] - a[1];
          const len = Math.hypot(dx, dz);
          const width = (10 + (river.name === 'NILE' || river.name === 'CONGO' ? 8 : 4)) * RW;
          const geo = new THREE.PlaneGeometry(width, len + 4);
          geo.rotateX(-Math.PI / 2);
          const mesh = new THREE.Mesh(geo, riverMat);
          mesh.position.set(mx, -0.6, mz);
          mesh.rotation.y = Math.atan2(dx, dz);
          scene.add(mesh);
        }
      });
    }

    /* =========================================================
       INSTANCED HELPER
       ========================================================= */
    const _dummy = new THREE.Object3D();
    const _color = new THREE.Color();

    function makeInstanced(geometry, material, points, config, colorFn) {
      const mesh = new THREE.InstancedMesh(geometry, material, points.length);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      points.forEach((p, i) => {
        _dummy.position.set(p[0], p[1] - .15, p[2]);
        _dummy.rotation.set(0, rnd() * TAU, 0);
        _dummy.scale.set(1, 1, 1);
        config && config(_dummy, p);
        _dummy.updateMatrix();
        mesh.setMatrixAt(i, _dummy.matrix);
        if (colorFn) mesh.setColorAt(i, colorFn(_color, p));
      });
      scene.add(mesh);
      return mesh;
    }

    function scatterPoints(count, filter) {
      const out = [];
      let attempts = 0;
      const MAX = count * 500;
      while (out.length < count && attempts++ < MAX) {
        const x = (rnd() - .5) * 2 * (E - 80);
        const z = (rnd() - .5) * 2 * (E - 80);
        const h = heightAt(x, z);
        if (filter(x, z, h)) out.push([x, h, z]);
      }
      if (out.length < count) {
        console.warn(`scatterPoints: only placed ${out.length}/${count}`);
      }
      return out;
    }

    const slopeAt = (x, z) =>
      Math.abs(heightAt(x + 16, z) - heightAt(x - 16, z)) +
      Math.abs(heightAt(x, z + 16) - heightAt(x, z - 16));

    /* =========================================================
       TREES — DENSITY SCALED
       ========================================================= */
    // Palms
    {
      const points = scatterPoints(N(250), (x, z, h) => h > 2 && h < 12 && !isDesert(x, z) && slopeAt(x, z) < 15);
      const trunkGeo = new THREE.CylinderGeometry(.6, 1.3, 30, 8, 10);
      trunkGeo.translate(0, 15, 0);
      const p = trunkGeo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const y = p.getY(i);
        p.setX(i, p.getX(i) + .02 * y * y);
      }
      const fronds = [];
      for (let i = 0; i < 10; i++) {
        const g = new THREE.PlaneGeometry(4.5, 18, 1, 7);
        g.translate(0, 9, 0);
        g.rotateX(-Math.PI / 2);
        const pp = g.attributes.position;
        for (let j = 0; j < pp.count; j++) {
          const L = -pp.getZ(j);
          pp.setY(j, pp.getY(j) + 1.2 * Math.sin(Math.min(L, 2) * 1) - .05 * L * L);
        }
        g.rotateY(i / 10 * TAU + rnd() * .3);
        fronds.push(g);
      }
      const crownGeo = mergeGeometries(fronds);
      const trunkMesh = makeInstanced(
        trunkGeo,
        new THREE.MeshStandardMaterial({ map: barkTex, roughness: 1 }),
        points,
        d => { const s = .7 + rnd() * .6; d.scale.setScalar(s); }
      );
      const crownMesh = new THREE.InstancedMesh(
        crownGeo,
        new THREE.MeshStandardMaterial({
          map: frondTex, alphaTest: .4, transparent: true, side: THREE.DoubleSide, roughness: .85
        }),
        points.length
      );
      crownMesh.castShadow = true;
      const m4 = new THREE.Matrix4(), t4 = new THREE.Matrix4(), m4b = new THREE.Matrix4();
      points.forEach((p, i) => {
        trunkMesh.getMatrixAt(i, m4);
        t4.makeTranslation(0, 30, 0);
        m4b.copy(m4).multiply(t4);
        crownMesh.setMatrixAt(i, m4b);
        crownMesh.setColorAt(i, _color.setHSL(.24 + rnd() * .05, .50, .34 + rnd() * .10));
      });
      scene.add(crownMesh);
    }

    // Baobab
    {
      const points = scatterPoints(N(100), (x, z, h) =>
        h > 4 && h < 50 && isSavanna(x, z) && !isDesert(x, z) && slopeAt(x, z) < 12
      ).map(p => [...p, 1.5 + rnd() * 1.0, rnd() * TAU]);

      const trunkGeo = new THREE.CylinderGeometry(7, 10.5, 28, 12, 4);
      trunkGeo.translate(0, 14, 0);
      const p = trunkGeo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        const n = fbm(x * .1 + y * .08, z * .1, 3) - .5;
        const bulge = 1 + .3 * Math.sin(y / 28 * Math.PI) + n * .2;
        p.setX(i, x * bulge);
        p.setZ(i, z * bulge);
      }
      trunkGeo.computeVertexNormals();

      const branches = [];
      for (let i = 0; i < 8; i++) {
        const angle = i / 8 * TAU + rnd() * .4;
        const len = 12 + rnd() * 10;
        const g = new THREE.CylinderGeometry(1, 2.4, len, 6);
        g.translate(0, len / 2, 0);
        g.rotateZ(.9);
        g.rotateY(angle);
        g.translate(0, 26 + rnd() * 6, 0);
        branches.push(g);
      }
      const branchesGeo = mergeGeometries(branches);

      const canopyCards = [];
      for (let i = 0; i < 40; i++) {
        const angle = rnd() * TAU;
        const r = 10 + rnd() * 12;
        const y = 36 + rnd() * 8;
        const g = new THREE.PlaneGeometry(7 + rnd() * 5, 6 + rnd() * 4);
        g.rotateX(rnd() * TAU);
        g.rotateY(rnd() * TAU);
        g.translate(Math.cos(angle) * r, y, Math.sin(angle) * r);
        canopyCards.push(g);
      }
      const canopyGeo = mergeGeometries(canopyCards);
      const cc = new Float32Array(canopyGeo.attributes.position.count * 3);
      for (let i = 0; i < cc.length; i += 3) { cc[i] = .55; cc[i + 1] = .60; cc[i + 2] = .35; }
      canopyGeo.setAttribute('color', new THREE.BufferAttribute(cc, 3));

      const trunkMat = new THREE.MeshStandardMaterial({
        map: barkTex, roughness: 1, color: 0xb89978
      });
      const canopyMat = new THREE.MeshStandardMaterial({
        map: leafCardTex, vertexColors: true, alphaTest: .45, side: THREE.DoubleSide, roughness: .85
      });

      makeInstanced(trunkGeo, trunkMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; },
        c => c.setHSL(.07, .25, .55 + rnd() * .10));
      makeInstanced(branchesGeo, trunkMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; },
        c => c.setHSL(.07, .25, .55 + rnd() * .10));
      makeInstanced(canopyGeo, canopyMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; },
        c => c.setRGB(.5 + rnd() * .15, .55 + rnd() * .15, .30 + rnd() * .10));
    }

    // Acacia
    {
      const points = scatterPoints(N(700), (x, z, h) =>
        h > 3 && h < 60 && !isDesert(x, z) && (isSavanna(x, z) || rnd() < .15) && slopeAt(x, z) < 15
      ).map(p => [...p, 1.4 + rnd() * .8, rnd() * TAU]);

      const trunkGeo = new THREE.CylinderGeometry(.7, 1.4, 16, 6, 2);
      trunkGeo.translate(0, 8, 0);

      const branchesGeo = (() => {
        const parts = [];
        for (let i = 0; i < 3; i++) {
          const a = i / 3 * TAU + rnd() * .3;
          const g = new THREE.CylinderGeometry(.35, .8, 9, 5);
          g.translate(0, 4.5, 0);
          g.rotateZ(.7);
          g.rotateY(a);
          g.translate(0, 14.5, 0);
          parts.push(g);
        }
        return mergeGeometries(parts);
      })();

      const canopyParts = [];
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * TAU;
        const r = 3.5 + rnd() * 7;
        const y = 15.5 + rnd() * 2.5;
        const g = new THREE.PlaneGeometry(10, 6);
        g.translate(Math.cos(a) * r, y, Math.sin(a) * r);
        g.rotateY(rnd() * TAU);
        canopyParts.push(g);
      }
      const canopyGeo = mergeGeometries(canopyParts);
      const cc = new Float32Array(canopyGeo.attributes.position.count * 3);
      for (let i = 0; i < cc.length; i += 3) { cc[i] = .50; cc[i + 1] = .58; cc[i + 2] = .34; }
      canopyGeo.setAttribute('color', new THREE.BufferAttribute(cc, 3));

      const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, roughness: 1, color: 0x8a7560 });
      const canopyMat = new THREE.MeshStandardMaterial({
        map: leafCardTex, vertexColors: true, alphaTest: .45, side: THREE.DoubleSide, roughness: .85
      });

      makeInstanced(trunkGeo, barkMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; });
      makeInstanced(branchesGeo, barkMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; });
      makeInstanced(canopyGeo, canopyMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; },
        c => c.setRGB(.50 + rnd() * .15, .58 + rnd() * .15, .34 + rnd() * .10));
    }

    // Broadleaf
    function crownGeometry(lobes, cards) {
      const parts = [];
      lobes.forEach(([lx, ly, lz, R]) => {
        for (let i = 0; i < cards; i++) {
          const u = rnd() * TAU;
          const v = Math.acos(2 * rnd() - 1);
          const rr = R * (.4 + .6 * Math.cbrt(rnd()));
          const x = lx + Math.sin(v) * Math.cos(u) * rr;
          const y = ly + Math.cos(v) * rr * .8;
          const z = lz + Math.sin(v) * Math.sin(u) * rr;
          const g = new THREE.PlaneGeometry(6, 6);
          g.rotateX(rnd() * TAU);
          g.rotateY(rnd() * TAU);
          g.rotateZ(rnd() * TAU);
          g.translate(x, y, z);
          const b = Math.min(1.1, Math.max(.32, .4 + .55 * (rr / R) + .28 * Math.cos(v)));
          const cs = [], nm = [];
          const nv = new THREE.Vector3(x - lx, (y - ly) * 1.2, z - lz).normalize();
          for (let k = 0; k < 4; k++) { cs.push(b, b, b * .9); nm.push(nv.x, nv.y, nv.z); }
          g.setAttribute('color', new THREE.Float32BufferAttribute(cs, 3));
          g.setAttribute('normal', new THREE.Float32BufferAttribute(nm, 3));
          parts.push(g);
        }
      });
      return mergeGeometries(parts);
    }

    function trunkGeometry(lobes) {
      const parts = [];
      const main = new THREE.CylinderGeometry(.5, 1.4, 14, 7, 3);
      main.translate(0, 7, 0);
      parts.push(main);
      lobes.slice(1).forEach(([x, y, z]) => {
        const dir = new THREE.Vector3(x, y - 4, z).sub(new THREE.Vector3(0, 10, 0));
        const len = dir.length();
        const g = new THREE.CylinderGeometry(.15, .4, len, 5, 1);
        g.translate(0, len / 2, 0);
        g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()));
        g.translate(0, 10, 0);
        parts.push(g);
      });
      return mergeGeometries(parts);
    }

    function coreGeometry(lobes) {
      return mergeGeometries(lobes.map(([x, y, z, R]) => {
        const g = new THREE.IcosahedronGeometry(1, 1);
        g.scale(R * .62, R * .5, R * .62);
        g.translate(x, y, z);
        return g;
      }));
    }

    {
      const points = scatterPoints(N(1500), (x, z, h) =>
        h > 4 && h < 80 && !isDesert(x, z) && slopeAt(x, z) < 15 &&
        (isForest(x, z) || rnd() < .30)
      ).map(p => [...p, 1.3 + rnd() * 1.0, rnd() * TAU]);

      const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, roughness: 1 });
      const coreMat = new THREE.MeshStandardMaterial({ color: 0x1a2f12, roughness: 1 });
      const leafMat = new THREE.MeshStandardMaterial({
        map: leafCardTex, vertexColors: true, alphaTest: .45, side: THREE.DoubleSide, roughness: .82
      });

      for (let v = 0; v < 3; v++) {
        const jitter = () => (rnd() - .5) * 2.4;
        const lobes = [
          [0, 16, 0, 7.8],
          [4.8 + jitter(), 13.4, 1.6 + jitter(), 5.4],
          [-4.4 + jitter(), 13.8, -2 + jitter(), 5.6],
          [.8 + jitter(), 20.8, .4 + jitter(), 4.8],
          [.8 + jitter(), 12.6, -4.8 + jitter(), 4.4]
        ];
        const part = points.filter((_, i) => i % 3 === v);

        makeInstanced(trunkGeometry(lobes), barkMat, part, (d, p) => {
          d.rotation.y = p[4]; d.scale.setScalar(p[3]);
        });
        const crown = makeInstanced(crownGeometry(lobes, 42), leafMat, part, (d, p) => {
          d.rotation.y = p[4]; d.scale.setScalar(p[3]);

#endif`

      g.translate(a.x, a.y, a.z);

    const herd = [];
    function spawnAnimals() {
      const U = 4.3 * 1.25;
      let total = 0;
      SPECIES.forEach(sp => {
        const ok = (x, z, h) => h > sp.minH && h < sp.maxH && !isDesert(x, z) && slopeAt(x, z) < 14;
        const tpl = buildAnimal(sp.spec);
        const groups = Math.max(2, Math.round(sp.herds * WS));
        for (let gi = 0; gi < groups; gi++) {
          const c = scatterPoints(1, ok)[0];
          if (!c) continue;
          const size = 2 + Math.floor(rnd() * sp.herdSize);
          for (let k = 0; k < size; k++) {
            const x = c[0] + (rnd() - .5) * 140, z = c[2] + (rnd() - .5) * 140, h = heightAt(x, z);
            if (!ok(x, z, h)) continue;
            const a = tpl.clone(true), sc = U * (.9 + rnd() * .2);
            a.scale.setScalar(sc);
            a.position.set(x, h, z);
            a.rotation.y = rnd() * TAU;
            a.userData = {
              legs: [0, 1, 2, 3].map(i => a.getObjectByName('leg' + i)),
              speed: sp.speed * sc * (.8 + rnd() * .4),
              cadence: 2.5 / (sp.spec.legs.len * sc),
              phase: rnd() * TAU, timer: rnd() * 6, moving: false, turn: 0,
              minH: sp.minH, maxH: sp.maxH
            };
            scene.add(a); herd.push(a); total++;
          }
        }
      });
      showStatus(`✓ Spawned ${total} animals in herds`, 5000);
    }
    spawnAnimals();

    function updateAnimals(dt) {
      const tx = controls.target.x, tz = controls.target.z;
      for (const a of herd) {
        const dx0 = a.position.x - tx, dz0 = a.position.z - tz;
        if (dx0 * dx0 + dz0 * dz0 > 2400 * 2400) continue;
        const u = a.userData;
        if ((u.timer -= dt) <= 0) { u.moving = rnd() < .55; u.timer = 3 + rnd() * 9; u.turn = (rnd() - .5) * .8; }
        let s = 0;
        if (u.moving) {
          const nx = a.position.x + Math.sin(a.rotation.y) * u.speed * dt;
          const nz = a.position.z + Math.cos(a.rotation.y) * u.speed * dt;
          const h = heightAt(nx, nz);
          if (h > u.minH && h < u.maxH && !isDesert(nx, nz) && Math.abs(nx) < E - 120 && Math.abs(nz) < E - 120) {
            a.position.set(nx, h, nz);
            a.rotation.y += u.turn * dt * .4;
            u.phase += dt * u.speed * u.cadence;
            s = Math.sin(u.phase) * .45;
          } else { a.rotation.y += Math.PI * .5; u.timer = 2 + rnd() * 3; }
        }
        const L = u.legs;
        if (s !== 0) { L[0].rotation.x = s; L[3].rotation.x = s; L[1].rotation.x = -s; L[2].rotation.x = -s; }
        else L.forEach(l => l.rotation.x *= .9);
      }
    }

    const clouds = [];
    for (let i = 0; i < Math.round(40 * WS); i++) {
      const cx = (rnd() - .5) * CL * 2;
      const cz = (rnd() - .5) * CL * 2;
      const cy = 1200 + rnd() * 600;
      for (let j = 0; j < 6; j++) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({
          map: cloudTex, transparent: true, depthWrite: false, fog: false, opacity: .85
        }));
        s.scale.set(1000 + rnd() * 800, 320 + rnd() * 200, 1);
        s.position.set(cx + (rnd() - .5) * 1000, cy + (rnd() - .5) * 60, cz + (rnd() - .5) * 560);
        scene.add(s);
        clouds.push(s);
      }
    }

    const birds = [];
    for (let i = 0; i < 20; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({

    /* =========================================================

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a07a, roughness: .55 });

    const hairMat = new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 1 });

    const man = new THREE.Group();
    const procMan = new THREE.Group();

    const makeLimb = (mat, r, len, y, x) => {
      const g = new THREE.Group();
      g.position.set(x, y, 0);

      m.position.y = -len / 2 - .05;
      m.castShadow = true;
      g.add(m);
      procMan.add(g);
      return g;
    };

    const legL = makeLimb(pantsMat, .3, 3, 3.6, -.44);
    const legR = makeLimb(pantsMat, .3, 3, 3.6, .44);

    // More realistic player details: shoes, hands, neck, eyes
    {

      [legL, legR].forEach(l => {

      [armL, armR].forEach(a => {

    man.position.set(400 * WS, heightAt(400 * WS, 2550 * WS), 2550 * WS);
    man.rotation.y = Math.PI;
    scene.add(man);

    const targetMarker = new THREE.Mesh(
      new THREE.RingGeometry(2.4, 3.6, 24),
      new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: .85, depthWrite: false })
    );
    targetMarker.rotation.x = -Math.PI / 2;
    targetMarker.visible = false;
    scene.add(targetMarker);

    let walkTarget = null;
    let walkPhase = 0;

    function setWalkTarget(x, z) {
      walkTarget = { x, z };
      targetMarker.position.set(x, heightAt(x, z) + .6, z);
      targetMarker.visible = true;
      flyCam = null;
    }

    function updateMan(dt) {
      let moveDir = null;
      let running = keys.shift;

      if (keys.w || keys.a || keys.s || keys.d) {
        camera.getWorldDirection(camForward);
        camForward.y = 0; camForward.normalize();
        camRight.crossVectors(camera.up, camForward).normalize();
        moveVec.set(0, 0, 0);
        if (keys.w) moveVec.add(camForward);
        if (keys.s) moveVec.sub(camForward);
        if (keys.d) moveVec.add(camRight);
        if (keys.a) moveVec.sub(camRight);
        if (moveVec.lengthSq()) {
          moveDir = moveVec.normalize();
          walkTarget = null;
          targetMarker.visible = false;
        }
      } else if (walkTarget) {
        const dx = walkTarget.x - man.position.x;
        const dz = walkTarget.z - man.position.z;
        const d = Math.hypot(dx, dz);
        if (d < 2.5) {
          walkTarget = null;
          targetMarker.visible = false;
        } else {
          moveDir = moveVec.set(dx / d, 0, dz / d);
          if (d > 600) running = true;
        }
      }

      if (moveDir) {
        const speed = running ? 260 : 90;
        const nx = THREE.MathUtils.clamp(man.position.x + moveDir.x * speed * dt, -E + 60, E - 60);
        const nz = THREE.MathUtils.clamp(man.position.z + moveDir.z * speed * dt, -E + 60, E - 60);
        const nh = heightAt(nx, nz);
        if (nh > -1.5 && nh - heightAt(man.position.x, man.position.z) < speed * dt * 3) {
          man.position.x = nx;
          man.position.z = nz;
        } else {
          walkTarget = null;
          targetMarker.visible = false;
        }
        let da = Math.atan2(moveDir.x, moveDir.z) - man.rotation.y;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        man.rotation.y += da * Math.min(1, dt * 10);
        walkPhase += dt * speed * 1.5;
        const s = Math.sin(walkPhase) * (running ? .9 : .6);
        legL.rotation.x = s;
        legR.rotation.x = -s;
        armL.rotation.x = -s * .8;
        armR.rotation.x = s * .8;
      } else {
        [legL, legR, armL, armR].forEach(l => l.rotation.x *= .85);
      }

      man.position.y = Math.max(heightAt(man.position.x, man.position.z), -1) +
        (moveDir ? Math.abs(Math.sin(walkPhase)) * .15 : 0);
    }

    /* =========================================================
       MAP
       ========================================================= */
    const baseMap = document.createElement('canvas');
    baseMap.width = baseMap.height = 1400;
    {
      const g = baseMap.getContext('2d');
      const S = 1400;
      const img = g.createImageData(S, S);
      for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
        const x = (i / S - .5) * 2 * E;
        const z = (j / S - .5) * 2 * E;
        const h = heightAt(x, z);
        let c;
        if (h < -1) {
          const k = smooth(0, 30, -h);
          c = [.14 - .08 * k, .38 - .22 * k, .58 - .18 * k];
        } else {
          c = groundColor(x, z, h, h > 150 ? .5 : 1);
          const shade = (heightAt(x - 15, z - 15) - heightAt(x + 15, z + 15)) * .008;
          c = c.map(v => Math.min(1, Math.max(0, v + shade)));
        }
        const o = (j * S + i) * 4;
        img.data[o] = c[0] * 255;
        img.data[o + 1] = c[1] * 255;
        img.data[o + 2] = c[2] * 255;
        img.data[o + 3] = 255;
      }
      g.putImageData(img, 0, 0);

      const w2m = (v) => (v / E + 1) / 2 * S;
      g.strokeStyle = 'rgba(60, 140, 200, 0.9)';
      g.lineWidth = 4;
      g.lineCap = 'round';
      RIVERS.forEach(river => {
        g.beginPath();
        const pts = river.pts;
        g.moveTo(w2m(pts[0][0]), w2m(pts[0][1]));
        for (let i = 1; i < pts.length; i++) {
          g.lineTo(w2m(pts[i][0]), w2m(pts[i][1]));
        }
        g.stroke();
      });
    }

    const worldToMap = (v, S) => (v / E + 1) / 2 * S;

    function drawMap(canvas, isBig) {
      const S = canvas.width;
      const g = canvas.getContext('2d');
      g.drawImage(baseMap, 0, 0, S, S);

      if (isBig) {
        g.font = '600 ' + S / 170 + 'px Poppins';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 3;
        g.strokeStyle = 'rgba(20,14,6,.85)';
        g.fillStyle = '#fff3d4';
        COUNTRIES.forEach(([name, x, z]) => {
          g.strokeText(name, worldToMap(x, S), worldToMap(z, S));
          g.fillText(name, worldToMap(x, S), worldToMap(z, S));
        });

        g.font = 'italic 700 ' + S / 180 + 'px Poppins';
        g.fillStyle = '#5fb8e8';
        g.strokeStyle = 'rgba(10, 30, 50, 0.9)';
        g.lineWidth = 3;
        RIVERS.forEach(river => {
          const pts = river.pts;
          const mid = pts[Math.floor(pts.length / 2)];
          g.strokeText(river.name, worldToMap(mid[0], S) + 18, worldToMap(mid[1], S) - 8);
          g.fillText(river.name, worldToMap(mid[0], S) + 18, worldToMap(mid[1], S) - 8);
        });
      }

      const px = worldToMap(controls.target.x, S);
      const py = worldToMap(controls.target.z, S);
      g.fillStyle = '#fff'; g.strokeStyle = '#d62b1b';
      g.lineWidth = isBig ? 4 : 3;
      g.beginPath(); g.arc(px, py, isBig ? S / 90 : S / 60, 0, TAU); g.fill(); g.stroke();

      const a = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
      g.beginPath(); g.moveTo(px, py);
      g.lineTo(px - Math.sin(a) * S / 22, py - Math.cos(a) * S / 22);
      g.stroke();
    }

    const mini = document.getElementById('mini');
    const mc = document.getElementById('mc');
    const mapEl = document.getElementById('map');
    const clickMap = (cv, e, cb) => {
      const r = cv.getBoundingClientRect();
      const wx = ((e.clientX - r.left) / r.width * 2 - 1) * E;
      const wz = ((e.clientY - r.top) / r.height * 2 - 1) * E;
      cb(wx, wz);
    };
    const toggleMap = force => mapEl.classList.toggle('on', force);
    mini.onclick = e => clickMap(mini, e, (x, z) => flyTo(x, z, 1500));
    mc.onclick = e => clickMap(mc, e, (x, z) => { toggleMap(false); flyTo(x, z, 1200); });
    mapEl.onclick = e => { if (e.target === mapEl) toggleMap(false); };

    /* =========================================================
       NAVIGATION
       ========================================================= */
    let flyCam = null;
    function flyTo(x, z, dist = 1200) {
      x = THREE.MathUtils.clamp(x, -E + 100, E - 100);
      z = THREE.MathUtils.clamp(z, -E + 100, E - 100);
      if (heightAt(x, z) < -1.5) return;
      man.position.set(x, heightAt(x, z), z);
      walkTarget = null;
      targetMarker.visible = false;
      const y = Math.max(heightAt(x, z), 0) + 6;
      const to = new THREE.Vector3(x, y, z);
      const dir = new THREE.Vector3(
        camera.position.x - controls.target.x, 0,
        camera.position.z - controls.target.z
      ).normalize();
      flyCam = {
        t: 0,
        fromTarget: controls.target.clone(),
        fromCam: camera.position.clone(),
        toTarget: to,
        toCam: to.clone().addScaledVector(dir, dist).setY(y + dist * .55)
      };
    }

    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let downPos = null;
    renderer.domElement.addEventListener('pointerdown', e => downPos = [e.clientX, e.clientY]);
    renderer.domElement.addEventListener('pointerup', e => {
      if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 5) return;
      mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObject(terrain)[0];
      if (hit && hit.point.y > -1.5) setWalkTarget(hit.point.x, hit.point.z);
    });

    const keys = {};
    const keyMap = { arrowup: 'w', arrowdown: 's', arrowleft: 'a', arrowright: 'd' };
    addEventListener('keydown', e => {
      let k = e.key.toLowerCase();
      if (keyMap[k]) { e.preventDefault(); k = keyMap[k]; }
      keys.shift = e.shiftKey;
      if ('wasd'.includes(k) && k.length === 1) keys[k] = 1;
      if (k === 'm') toggleMap();
      if (k === 'escape') toggleMap(false);
    });
    addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      keys[keyMap[k] || k] = 0;
      keys.shift = e.shiftKey;
    });

    const camForward = new THREE.Vector3();
    const camRight = new THREE.Vector3();
    const moveVec = new THREE.Vector3();
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    /* =========================================================
       LOOP
       ========================================================= */
    const clock = new THREE.Clock();
    let mapTimer = 0;
    let lastLoc = '';
    const locEl = document.getElementById('loc');

    function nearestCountry(x, z) {
      let best = COUNTRIES[0][0];
      let bestD = Infinity;
      COUNTRIES.forEach(([name, cx, cz]) => {
        const d = Math.hypot(x - cx, z - cz);
        if (d < bestD) { bestD = d; best = name; }
      });
      return best[0] + best.slice(1).toLowerCase().replace(/\b\w/g, s => s);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .05);
      const t = clock.elapsedTime;

      if (flyCam) {
        flyCam.t = Math.min(1, flyCam.t + dt / 1.8);
        const k = flyCam.t * flyCam.t * (3 - 2 * flyCam.t);
        controls.target.lerpVectors(flyCam.fromTarget, flyCam.toTarget, k);
        camera.position.lerpVectors(flyCam.fromCam, flyCam.toCam, k);
        if (flyCam.t >= 1) flyCam = null;
      }

      updateMan(dt);
      if (!flyCam) {
        const k = Math.min(1, dt * 6);
        const ax = (man.position.x - controls.target.x) * k;
        const ay = (man.position.y + 10 - controls.target.y) * k;
        const az = (man.position.z - controls.target.z) * k;
        camera.position.x += ax; camera.position.y += ay; camera.position.z += az;
        controls.target.x += ax; controls.target.y += ay; controls.target.z += az;
      }

      if (camera.position.y < heightAt(camera.position.x, camera.position.z) + 15) {
        camera.position.y = heightAt(camera.position.x, camera.position.z) + 15;
      }

      sun.target.position.set(
        Math.round(controls.target.x / 16) * 16, 0,
        Math.round(controls.target.z / 16) * 16
      );
      sun.position.copy(sun.target.position).addScaledVector(sunDir, 3000);

      windUniform.value = t;
      waterNrm.offset.set(t * .05, t * .03);
      updateAnimals(dt);
      clouds.forEach(s => {
        s.position.x += dt * 30;
        s.position.z += dt * 12;
        if (s.position.x > CL) s.position.x -= CL * 2;
        if (s.position.z > CL) s.position.z -= CL * 2;
      });
      birds.forEach((s, i) => {
        const a = t * .08 + i * 1.05;
        const r = 900 + 240 * Math.sin(i * 3.7);
        s.position.set(controls.target.x + Math.cos(a) * r, 500 + 80 * Math.sin(t * .23 + i * 2), controls.target.z + Math.sin(a) * r);
        s.material.rotation = Math.sin(t * 1.5 + i) * .25;
      });

      controls.update();
      renderer.render(scene, camera);

      mapTimer += dt;
      if (mapTimer > .2) {
        mapTimer = 0;
        drawMap(mini, false);
        if (mapEl.classList.contains('on')) drawMap(mc, true);
        const loc = nearestCountry(controls.target.x, controls.target.z);
        if (loc !== lastLoc) {
          lastLoc = loc;
          locEl.textContent = loc;
        }
      }
    }
    animate();

    const ld = document.getElementById('ld');
    setTimeout(() => {
      ld.style.opacity = 0;
      setTimeout(() => ld.remove(), 900);
    }, 500);
  </script>
</body>
</html>
