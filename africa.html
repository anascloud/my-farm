<body>
  <div id="id" class="p"><b>AFRICA · REAL MAP</b><span>by Anas Ahmed</span></div>

  <div id="ld">Growing Africa…</div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    /* =========================================================
       SEEDED RANDOM
       ========================================================= */
    const TAU = Math.PI * 2;
    let _seed = 11;
    const rnd = () => (_seed = _seed * 16807 % 2147483647) / 2147483647;
    const rndBetween = (a, b) => a + rnd() * (b - a);
    const hs = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
    const vnoise = (x, y) => {
      const i = Math.floor(x), j = Math.floor(y);
      const u = x - i, v = y - j;
      const s = u * u * (3 - 2 * u), t = v * v * (3 - 2 * v);
      return hs(i, j) * (1 - s) * (1 - t)
        + hs(i + 1, j) * s * (1 - t)
        + hs(i, j + 1) * (1 - s) * t
        + hs(i + 1, j + 1) * s * t;
    };
    const fbm = (x, y, o = 5) => {
      let a = .5, f = 1, s = 0;
      for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= .5; }
      return s;
    };
    const smooth = (a, b, x) => {
      x = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return x * x * (3 - 2 * x);
    };

    /* =========================================================
       CANVAS / TEXTURE HELPERS
       ========================================================= */
    const canvas2D = (w, h = w) => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return [c, c.getContext('2d')];
    };
    const texFromCanvas = (c, rep = 1, aniso = 8) => {
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = aniso;
      if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); }
      return t;
    };
    const normalFromHeight = (c, strength = 2) => {
      const S = c.width;
      const g = c.getContext('2d');
      const im = g.getImageData(0, 0, S, S).data;
      const [c2, g2] = canvas2D(S, S);
      const out = g2.createImageData(S, S);
      const hgt = (x, y) => im[(((y + S) % S) * S + ((x + S) % S)) * 4] / 255;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const dx = (hgt(x + 1, y) - hgt(x - 1, y)) * strength;
        const dy = (hgt(x, y + 1) - hgt(x, y - 1)) * strength;
        const l = Math.hypot(dx, dy, 1);
        const i = (y * S + x) * 4;
        out.data[i] = (-dx / l * .5 + .5) * 255;
        out.data[i + 1] = (-dy / l * .5 + .5) * 255;
        out.data[i + 2] = (1 / l) * 255;
        out.data[i + 3] = 255;
      }
      g2.putImageData(out, 0, 0);
      const t = new THREE.CanvasTexture(c2);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      return t;
    };
    const NOISE_GLSL = `float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float v21(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm2(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*v21(p);p*=2.03;a*=.5;}return s;}\n`;

    /* =========================================================
       WORLD CONSTANTS (enlarged map)
       ========================================================= */
    const E = 600;

    /* Land blobs (real African coastline approximation) */
    const AFRICA_BLOBS = [
      [ 20, -340, 210, 110, 1.0],   // North Africa band
      [ -40, -320, 140, 100, 1.0],  // Morocco/W Sahara
      [ 80, -320, 110, 95, 1.0],    // Libya/Egypt
      [ 130, -300, 80, 85, 1.0],    // Egypt/Sinai
      [ 10, -260, 210, 95, 1.0],    // Central Sahara
      [ -55, -140, 110, 80, 1.0],   // Mauritania/Mali
      [-105, -60, 80, 65, 1.0],     // Senegal/Guinea
      [-95, 20, 75, 60, 1.0],       // Ivory Coast/Ghana
      [-70, 65, 75, 60, 1.0],       // Nigeria
      [-25, -50, 95, 75, 1.0],      // Niger
      [ 30, -20, 80, 70, 1.0],      // Chad
      [ 50, 70, 85, 70, 1.0],       // Cameroon/CAR
      [ 60, 150, 70, 65, 1.0],      // DRC
      [ 15, 115, 60, 60, 1.0],      // Gabon/Congo
      [ 135, -130, 75, 55, 1.0],    // Sudan
      [ 175, -70, 50, 40, 1.0],     // Eritrea
      [ 210, -40, 50, 35, 1.0],     // Ethiopia
      [ 240, -60, 35, 25, 1.0],     // Somalia Horn
      [ 165, 50, 60, 55, 1.0],      // Kenya/Uganda
      [ 150, 135, 65, 70, 1.0],     // Tanzania
      [ 90, 240, 80, 70, 1.0],      // Angola/Zambia
      [ 110, 335, 70, 65, 1.0],     // Zimbabwe/Mozambique
      [ 80, 415, 60, 60, 1.0],      // Botswana/Namibia
      [ 75, 505, 55, 55, 1.0],      // South Africa
      [ 245, 270, 30, 70, 1.0]      // Madagascar
    ];

    /* Real mountain ranges (world coords) */
    const MOUNTAINS = [
      [-45, -330, 55, 20, 1.2],   // Atlas
      [-15, -320, 45, 18, 1.1],
      [ 25, -310, 35, 15, 1.0],
      [ 50, -235, 25, 25, 1.0],   // Ahaggar
      [ 80, -135, 30, 25, 1.0],   // Tibesti
      [195, -55, 35, 25, 1.3],    // Ethiopian Highlands
      [210, -20, 25, 20, 1.1],
      [150, 60, 25, 35, 1.1],     // Rwenzori/Rift
      [165, 55, 15, 15, 1.0],     // Mt Kenya
      [170, 115, 15, 15, 1.2],    // Kilimanjaro
      [100, 495, 30, 35, 1.4],    // Drakensberg
      [ 80, 465, 20, 25, 1.1],
      [ 50, 60, 15, 20, 0.9],     // Cameroon line
      [ 55, 430, 20, 30, 0.8],    // Namib coastal
      [135, -85, 20, 15, 0.9]     // Marrah
    ];

    /* Rivers (polylines) */
    const RIVERS = [
      // Nile
      [[165, 100],[155, 50],[145, 0],[135,-55],[125,-120],[115,-190],[105,-250],[95,-310],[90,-350]],
      // Blue Nile
      [[195,-50],[175,-65],[155,-80],[135,-115]],
      // Congo
      [[75, 140],[62, 155],[45, 170],[25, 175],[5, 165],[-15, 150],[-38, 140]],
      // Niger
      [[-105, 25],[-95, 0],[-75,-40],[-55,-70],[-40,-100],[-20,-80],[0,-25],[25, 12]],
      // Senegal
      [[-115,-45],[-105,-30],[-90,-15],[-75, 0]],
      // Zambezi
      [[95, 265],[110, 290],[125, 320],[130, 360],[125, 410]],
      // Orange
      [[85, 480],[75, 505],[65, 530],[60, 550]],
      // Limpopo
      [[90, 430],[105, 440],[115, 455]],
      // Volta
      [[-75, 20],[-80, 40],[-85, 60],[-90, 75]],
      // Cubango/Okavango
      [[85, 320],[75, 360],[70, 400],[65, 425]]
    ];

    /* Forest regions */
    const FORESTS = [
      [ 45, 110, 70, 55],   // Congo rainforest
      [ 15, 140, 45, 40],   // Gabon/Congo
      [-75, 25, 45, 30],    // West African
      [245, 265, 25, 55]    // Madagascar east
    ];

    /* Deserts */
    const DESERTS = [
      [ 10, -260, 220, 105],  // Sahara
      [ 75, 430, 60, 55],     // Kalahari
      [ 45, 480, 25, 50]      // Namib
    ];

    /* Savanna */
    const SAVANNA = [
      [-50, -75, 125, 100],
      [ 50, 25, 100, 75],
      [125, 200, 100, 100]
    ];

    /* Country labels with approximate centroids */
    const COUNTRIES = [
      ['MOROCCO', -40, -330], ['ALGERIA', 25, -320], ['TUNISIA', 65, -305],
      ['LIBYA', 75, -270], ['EGYPT', 130, -285], ['W. SAHARA', -80, -300],
      ['MAURITANIA', -70, -200], ['MALI', -40, -150], ['SENEGAL', -110, -75],
      ['GAMBIA', -108, -55], ['GUINEA-BISSAU', -102, -40], ['GUINEA', -95, -25],
      ['SIERRA LEONE', -90, -10], ['LIBERIA', -85, 10], ['IVORY COAST', -80, 25],
      ['BURKINA FASO', -50, 20], ['GHANA', -70, 45], ['TOGO', -65, 55], ['BENIN', -60, 62],
      ['NIGERIA', -30, 55], ['NIGER', 0, -55], ['CHAD', 50, -25],
      ['CAMEROON', 20, 55], ['C.A.R.', 65, 30], ['EQ. GUINEA', 10, 85],
      ['GABON', 22, 105], ['CONGO', 35, 125], ['DR CONGO', 75, 155], ['ANGOLA', 80, 265],
      ['SUDAN', 135, -140], ['S. SUDAN', 135, -50], ['ETHIOPIA', 205, -45],
      ['ERITREA', 195, -85], ['DJIBOUTI', 220, -55], ['SOMALIA', 250, -65],
      ['KENYA', 170, 50], ['UGANDA', 150, 20], ['RWANDA', 130, 75], ['BURUNDI', 130, 90],
      ['TANZANIA', 155, 140], ['MALAWI', 145, 195], ['MOZAMBIQUE', 145, 315],
      ['ZAMBIA', 100, 250], ['ZIMBABWE', 115, 325], ['BOTSWANA', 85, 410],
      ['NAMIBIA', 60, 435], ['SOUTH AFRICA', 80, 510], ['LESOTHO', 85, 500],
      ['ESWATINI', 105, 490], ['MADAGASCAR', 245, 265]
    ];

    /* =========================================================
       GEOGRAPHY FUNCTIONS
       ========================================================= */
    function inRegion(x, z, regions) {
      for (const [cx, cz, rx, rz] of regions) {
        const d = Math.hypot((x - cx) / rx, (z - cz) / rz);
        if (d < 1) return 1 - d;
      }
      return 0;
    }

    function landMask(x, z) {
      let s = -1;
      for (const [cx, cz, rx, rz, w] of AFRICA_BLOBS) {
        const d = 1 - Math.hypot((x - cx) / rx, (z - cz) / rz);
        s = Math.max(s, d * w);
      }
      s += (fbm(x * .01, z * .01, 4) - .5) * .28;
      return s;
    }

    function riverDistance(x, z) {
      let best = 1e9;
      for (const line of RIVERS) {
        for (let i = 0; i < line.length - 1; i++) {
          const a = line[i], b = line[i + 1];
          const dx = b[0] - a[0], dz = b[1] - a[1];
          const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (z - a[1]) * dz) / (dx * dx + dz * dz)));
          const d = Math.hypot(x - a[0] - t * dx, z - a[1] - t * dz);
          if (d < best) best = d;
        }
      }
      return best;
    }

    function heightAt(x, z) {
      const s = landMask(x, z);
      let h;
      if (s > 0) {
        h = Math.min(s * 8, 3.5) + (fbm(x * .015, z * .015) - .5) * 1.6 * Math.min(1, s * 3);
        for (const [mx, mz, rx, rz, k] of MOUNTAINS) {
          const m = Math.max(0, 1 - Math.hypot((x - mx) / rx, (z - mz) / rz));
          h += k * m * m * 55 * Math.min(1, s * 2);
        }
        const depressions = [[50, 130, 55, 45, 1.2], [30, -55, 45, 35, 0.8]];
        for (const [dx, dz, rx, rz, k] of depressions) {
          const m = Math.max(0, 1 - Math.hypot((x - dx) / rx, (z - dz) / rz));
          h -= k * m * m * 5;
        }
        const rd = riverDistance(x, z);
        if (rd < 6) {
          const k = smooth(2, 6, rd);
          h = h * k + (-.6) * (1 - k);
        }
        h = Math.max(h, -.4);
      } else {
        h = s * 30;
        h = Math.max(h, -14);
      }
      return h;
    }

    function groundColor(x, z, h, ny = 1) {
      const n = fbm(x * .08, z * .08, 3);
      const f = fbm(x * .008 + 7, z * .008, 3);
      const dry = fbm(x * .02 + 11, z * .02, 3);

      if (h < -.15) {
        const k = smooth(0, 8, -h);
        return [.22 - .16 * k + .02 * n, .32 - .22 * k + .02 * n, .25 - .14 * k];
      }
      if (h < .8) {
        const k = smooth(.02, .7, h);
        return [.52 + .20 * k + n * .05, .44 + .22 * k + n * .05, .28 + .18 * k + n * .04];
      }
      const desert = Math.max(inRegion(x, z, DESERTS), 0);
      if (desert > 0) {
        const d = .58 + n * .14 - desert * .06;
        return [d + .14, d * .82 + .02, d * .58];
      }
      if (h > 30 || ny < .68) {
        const band = .32 + .06 * Math.sin(h * 1.4 + f * 5) + n * .09;
        return [band, band * .95, band * .88];
      }
      const forest = Math.max(inRegion(x, z, FORESTS), 0);
      if (forest > .2) {
        const fk = smooth(.2, .8, forest);
        const dk = smooth(.3, .7, f) * .65;
        const gr = [.10 + n * .08, .24 + n * .10, .05 + n * .03];
        const shaded = gr.map(v => v * (1 - .4 * dk));
        const sr = smooth(.9, .5, forest);
        return [
          shaded[0] * (1 - sr) + .36 * sr,
          shaded[1] * (1 - sr) + .34 * sr,
          shaded[2] * (1 - sr) + .14 * sr
        ];
      }
      const sv = Math.max(inRegion(x, z, SAVANNA), 0);
      if (sv > .1) {
        const d = .44 + n * .10;
        return [d, d * .86 + .02, d * .40];
      }
      const g = [.17 + n * .10, .29 + n * .12, .09 + n * .05];
      const dr = smooth(.55, .78, dry);
      return [
        g[0] * (1 - dr) + .40 * dr,
        g[1] * (1 - dr) + .38 * dr,
        g[2] * (1 - dr) + .16 * dr
      ];
    }

    function isDesert(x, z) { return inRegion(x, z, DESERTS) > .3; }
    function isForest(x, z) { return inRegion(x, z, FORESTS) > .3; }
    function isSavanna(x, z) { return inRegion(x, z, SAVANNA) > .2; }

    /* =========================================================
       RENDERER / SCENE / LIGHTS
       ========================================================= */
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .5, 12000);
    camera.position.set(-100, 500, 900);

    const controls = new OrbitControls(camera, renderer.domElement);
    Object.assign(controls, {
      enableDamping: true,
      dampingFactor: .06,
      maxPolarAngle: Math.PI / 2.05,
      minDistance: 20,
      maxDistance: 3000,
      enablePan: false
    });
    controls.target.set(75, 2, 505);

    const sky = new Sky();
    sky.scale.setScalar(20000);
    const skyU = sky.material.uniforms;
    skyU.turbidity.value = 2.6;
    skyU.rayleigh.value = 2.2;
    skyU.mieCoefficient.value = .004;
    skyU.mieDirectionalG.value = .84;
    const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(56), THREE.MathUtils.degToRad(150));
    skyU.sunPosition.value.copy(sunDir);
    scene.add(sky);

    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(sky).texture;
    scene.environmentIntensity = 0.42;
    scene.fog = new THREE.FogExp2(0x89a7c2, .0004);

    scene.add(new THREE.HemisphereLight(0xcfe3f5, 0x3a4528, 0.35));
    const sun = new THREE.DirectionalLight(0xffe4b8, 3.0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -350, right: 350, top: 350, bottom: -350, near: 1, far: 1500 });
    sun.shadow.bias = -.0003;
    sun.shadow.normalBias = 1.0;
    scene.add(sun, sun.target);

    /* =========================================================
       SHARED TEXTURES
       ========================================================= */
    const noiseTex = (base, cols, count, rep, sz = 256) => {
      const [c, g] = canvas2D(sz);
      g.fillStyle = base;
      g.fillRect(0, 0, sz, sz);
      for (let i = 0; i < count; i++) {
        g.fillStyle = cols[i % cols.length];
        g.globalAlpha = .06 + rnd() * .14;
        g.beginPath();
        g.arc(rnd() * sz, rnd() * sz, 1 + rnd() * 5, 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
      return texFromCanvas(c, rep);
    };

    const detailTex = noiseTex('#ffffff', ['#d8d8d8', '#bdbdbd', '#efefef', '#a8a8a8'], 2600, 400);

    /* Bark texture */
    const [barkC, barkG] = canvas2D(512);
    const [barkH, barkHG] = canvas2D(512);
    barkG.fillStyle = '#54422e';
    barkG.fillRect(0, 0, 512, 512);
    barkHG.fillStyle = '#8a8a8a';
    barkHG.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 150; i++) {
      const x0 = rnd() * 512;
      const amp = 2 + rnd() * 5;
      const per = 50 + rnd() * 90;
      const ph = rnd() * TAU;
      const w = 2 + rnd() * 7;
      const light = rnd() < .45;
      const col = light ? `rgba(148,118,88,${.25 + rnd() * .3})` : `rgba(34,24,15,${.3 + rnd() * .4})`;
      const hcol = light ? 'rgba(230,230,230,.45)' : 'rgba(20,20,20,.55)';
      barkG.strokeStyle = col;
      barkHG.strokeStyle = hcol;
      barkG.lineWidth = barkHG.lineWidth = w;
      barkG.beginPath();
      barkHG.beginPath();
      for (let y = 0; y <= 512; y += 16) {
        const x = x0 + Math.sin(y / per * TAU + ph) * amp;
        if (y === 0) { barkG.moveTo(x, y); barkHG.moveTo(x, y); }
        else { barkG.lineTo(x, y); barkHG.lineTo(x, y); }
      }
      barkG.stroke();
      barkHG.stroke();
    }
    const barkTex = texFromCanvas(barkC, 1);
    const barkNrm = normalFromHeight(barkH, 3);

    /* Leaf card texture */
    const leafCardTex = (() => {
      const [c, g] = canvas2D(256);
      const drawLeaf = (x, y, a, L, W, cols, alpha) => {
        g.save();
        g.translate(x, y);
        g.rotate(a);
        g.globalAlpha = alpha;
        const grad = g.createLinearGradient(0, 0, 0, -L);
        grad.addColorStop(0, cols[0]);
        grad.addColorStop(1, cols[1]);
        g.fillStyle = grad;
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(W, -L * .35, 0, -L);
        g.quadraticCurveTo(-W, -L * .35, 0, 0);
        g.fill();
        g.strokeStyle = 'rgba(225,238,195,.45)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(0, -2);
        g.lineTo(0, -L + 3);
        g.stroke();
        g.restore();
      };
      for (let i = 0; i < 26; i++) {
        const a = rnd() * TAU;
        const r = Math.sqrt(rnd()) * 96;
        drawLeaf(128 + Math.cos(a) * r, 128 + Math.sin(a) * r, rnd() * TAU, 34 + rnd() * 22, 9 + rnd() * 6, ['#1c3a10', '#26490f'], .95);
      }
      const palettes = [
        ['#2c5417', '#4c8226'],
        ['#37661d', '#5d9a2e'],
        ['#416f22', '#6fae3a']
      ];
      for (let i = 0; i < 60; i++) {
        const a = rnd() * TAU;
        const r = Math.sqrt(rnd()) * 104;
        drawLeaf(128 + Math.cos(a) * r, 128 + Math.sin(a) * r, rnd() * TAU, 30 + rnd() * 26, 8 + rnd() * 7, palettes[i % 3], 1);
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      return t;
    })();

    const leafTex = noiseTex('#3f6d24', ['#2c4d18', '#55882e', '#6fa03a', '#24421a'], 1600, 3);

    /* Palm frond texture */
    const frondTex = (() => {
      const [c, g] = canvas2D(128, 512);
      const grad = g.createLinearGradient(0, 512, 0, 0);
      grad.addColorStop(0, '#6a7a34');
      grad.addColorStop(1, '#3f6d2a');
      g.strokeStyle = grad;
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(64, 512);
      g.quadraticCurveTo(64, 260, 64, 6);
      g.stroke();
      const cols = ['#33591d', '#3f6d24', '#4a7d2a', '#578f31'];
      for (let i = 0; i < 52; i++) {
        const t2 = i / 52;
        const y = 500 - t2 * 486;
        const L = 56 * Math.sin(Math.min(1, t2 * 1.15) * 2.4) + 8;
        for (const s of [-1, 1]) {
          const lg = g.createLinearGradient(64, y, 64 + s * L, y + L * .5);
          lg.addColorStop(0, cols[i % 4]);
          lg.addColorStop(1, '#69a03c');
          g.strokeStyle = lg;
          g.lineWidth = 3.4;
          g.beginPath();
          g.moveTo(64, y);
          g.quadraticCurveTo(64 + s * L * .55, y - 6, 64 + s * L, y + L * .5);
          g.stroke();
        }
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      return t;
    })();

    /* Grass texture */
    const grassTex = (() => {
      const [c, g] = canvas2D(64, 128);
      for (let i = 0; i < 26; i++) {
        const x = 5 + rnd() * 54;
        const l = 46 + rnd() * 76;
        const bend = (rnd() - .5) * 34;
        const dry = rnd() < .45;
        const grad = g.createLinearGradient(x, 128, x + bend, 128 - l);
        const greens = ['#2c4a18', '#33551c', '#3d6420'];
        grad.addColorStop(0, dry ? '#8a6e2c' : greens[i % 3]);
        grad.addColorStop(.6, dry ? '#b89a4a' : '#5c8a2c');
        grad.addColorStop(1, dry ? '#d8c070' : '#8ab04a');
        g.strokeStyle = grad;
        g.lineWidth = 1.4 + rnd() * 1.6;
        g.beginPath();
        g.moveTo(x, 128);
        g.quadraticCurveTo(x + bend * .3, 128 - l * .6, x + bend, 128 - l);
        g.stroke();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      return t;
    })();

    /* Rock texture */
    const [rockC, rockG] = canvas2D(512);
    const [rockH, rockHG] = canvas2D(512);
    rockG.fillStyle = '#7b766c';
    rockG.fillRect(0, 0, 512, 512);
    rockHG.fillStyle = '#8a8a8a';
    rockHG.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 260; i++) {
      const v = 90 + rnd() * 90;
      rockG.fillStyle = `rgba(${v},${v * .98},${v * .92},.12)`;
      rockG.beginPath();
      rockG.arc(rnd() * 512, rnd() * 512, 4 + rnd() * 26, 0, TAU);
      rockG.fill();
      rockHG.fillStyle = `rgba(${rnd() < .5 ? 40 : 200},${rnd() < .5 ? 40 : 200},${rnd() < .5 ? 40 : 200},.08)`;
      rockHG.beginPath();
      rockHG.arc(rnd() * 512, rnd() * 512, 4 + rnd() * 22, 0, TAU);
      rockHG.fill();
    }
    for (let i = 0; i < 14; i++) {
      rockG.strokeStyle = 'rgba(30,28,24,.5)';
      rockHG.strokeStyle = 'rgba(0,0,0,.6)';
      rockG.lineWidth = rockHG.lineWidth = 1 + rnd() * 1.6;
      let x = rnd() * 512, y = rnd() * 512;
      rockG.beginPath();
      rockHG.beginPath();
      rockG.moveTo(x, y);
      rockHG.moveTo(x, y);
      for (let k = 0; k < 7; k++) {
        x += (rnd() - .5) * 90;
        y += (rnd() - .5) * 90;
        rockG.lineTo(x, y);
        rockHG.lineTo(x, y);
      }
      rockG.stroke();
      rockHG.stroke();
    }
    const rockTex = texFromCanvas(rockC, 3);
    const rockNrm = normalFromHeight(rockH, 2.6);

    /* Cloth */
    const clothTex = noiseTex('#ffffff', ['#e8e8e8', '#cfcfcf', '#f5f5f5'], 900, 6);

    /* Terrain normal */
    const terrainNrm = (() => {
      const [c, g] = canvas2D(256);
      g.fillStyle = '#808080';
      g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 900; i++) {
        g.fillStyle = rnd() < .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.10)';
        g.beginPath();
        g.arc(rnd() * 256, rnd() * 256, 1 + rnd() * 4, 0, TAU);
        g.fill();
      }
      const t = normalFromHeight(c, 1.4);
      t.repeat.set(500, 500);
      return t;
    })();

    /* Water normal */
    const waterNrm = (() => {
      const S = 256;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      const img = g.createImageData(S, S);
      const a = TAU / S;
      const hh = (x, y) =>
        Math.sin(x * a * 4 + Math.sin(y * a * 2) * 2) +
        Math.sin(y * a * 6 + x * a) * .5 +
        Math.sin((x + y) * a * 8) * .3 +
        Math.sin((x - y) * a * 13) * .15;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const dx = hh(x + 1, y) - hh(x - 1, y);
        const dy = hh(x, y + 1) - hh(x, y - 1);
        const i = (y * S + x) * 4;
        img.data[i] = 128 - dx * 40;
        img.data[i + 1] = 128 - dy * 40;
        img.data[i + 2] = 255;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(600, 600);
      return t;
    })();

    /* Cloud texture */
    const cloudTex = (() => {
      const [c, g] = canvas2D(256);
      for (let i = 0; i < 16; i++) {
        const x = 128 + (rnd() - .5) * 130;
        const y = 120 + (rnd() - .5) * 60 - i * 1.5;
        const r = 40 + rnd() * 55;
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(255,255,255,.42)');
        grad.addColorStop(.7, 'rgba(250,250,252,.18)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grad;
        g.beginPath();
        g.arc(x, y, r, 0, TAU);
        g.fill();
      }
      const shade = g.createLinearGradient(0, 90, 0, 200);
      shade.addColorStop(0, 'rgba(120,130,150,0)');
      shade.addColorStop(1, 'rgba(120,130,150,.20)');
      g.fillStyle = shade;
      g.fillRect(0, 0, 256, 256);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    const birdTex = (() => {
      const [c, g] = canvas2D(64, 32);
      g.strokeStyle = 'rgba(30,30,34,.9)';
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(4, 20);
      g.quadraticCurveTo(18, 6, 32, 16);
      g.quadraticCurveTo(46, 6, 60, 20);
      g.stroke();
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    /* =========================================================
       TERRAIN MESH
       ========================================================= */
    const SEG = 620;
    const terrainGeo = new THREE.PlaneGeometry(E * 2, E * 2, SEG, SEG);
    terrainGeo.rotateX(-Math.PI / 2);
    {
      const pos = terrainGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
      }
      terrainGeo.computeVertexNormals();
      const norm = terrainGeo.attributes.normal;
      const colors = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const c = groundColor(
          pos.getX(i),
          pos.getZ(i),
          pos.getY(i),
          norm.getY(i)
        );
        colors.set(c, i * 3);
      }
      terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }
    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      map: detailTex,
      normalMap: terrainNrm,
      normalScale: new THREE.Vector2(.8, .8),
      roughness: .96
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    /* =========================================================
       OCEAN
       ========================================================= */
    const heightData = new Float32Array(256 * 256);
    for (let j = 0; j < 256; j++) for (let i = 0; i < 256; i++) {
      heightData[j * 256 + i] = heightAt((i / 256 - .5) * 2 * E, (j / 256 - .5) * 2 * E);
    }
    const heightTex = new THREE.DataTexture(heightData, 256, 256, THREE.RedFormat, THREE.FloatType);
    heightTex.minFilter = heightTex.magFilter = THREE.LinearFilter;
    heightTex.generateMipmaps = false;
    heightTex.needsUpdate = true;

    const waterUniforms = { uTime: { value: 0 }, uHeight: { value: heightTex } };
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x0d3b66,
      roughness: 0.28,
      metalness: 0.0,
      transparent: true,
      opacity: 0.96,
      normalMap: waterNrm,
      normalScale: new THREE.Vector2(0.65, 0.65),
      envMapIntensity: 0.65
    });
    waterMat.customProgramCacheKey = () => 'africa-water';
    waterMat.onBeforeCompile = shader => {
      Object.assign(shader.uniforms, waterUniforms);
      shader.vertexShader = 'varying vec3 vWorldPos;\n' + shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\nvWorldPos=(modelMatrix*vec4(position,1.0)).xyz;'
      );
      shader.fragmentShader = 'varying vec3 vWorldPos;\nuniform sampler2D uHeight;\nuniform float uTime;\n' +
        NOISE_GLSL +
        shader.fragmentShader
          .replace('#include <color_fragment>', `#include <color_fragment>
vec2 huv = vWorldPos.xz/${(2 * E).toFixed(1)} + .5;
float wth = texture2D(uHeight, clamp(huv, 0.001, 0.999)).r;
float wwav = fbm2(vWorldPos.xz*.3 + vec2(uTime*.4, -uTime*.3));
float wdep = max(-wth, 0.0);
vec3 shallow = vec3(0.14, 0.66, 0.80);
vec3 deep    = vec3(0.02, 0.11, 0.30);
vec3 wcol    = mix(shallow, deep, smoothstep(0.3, 8.0, wdep));
float wfm = smoothstep(.4, -.1, wth + (wwav-.5)*.4);
float wfoam = clamp(wfm*(.30+.7*fbm2(vWorldPos.xz*1.4 + vec2(-uTime*.6, uTime*.4))), 0.0, 1.0);
diffuseColor.rgb = mix(wcol, vec3(.86,.90,.93), wfoam * 0.8);`)
          .replace('#include <roughnessmap_fragment>',
            '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, .6, wfoam);')
          .replace('#include <opaque_fragment>', `
float fresnel = pow(1.0 - max(dot(normal, normalize(vViewPosition)), 0.0), 3.0);
outgoingLight = mix(outgoingLight, outgoingLight * vec3(0.40, 0.60, 0.92), fresnel * 0.6);
outgoingLight = mix(outgoingLight, outgoingLight * vec3(0.30, 0.50, 0.85), 0.25);
#include <opaque_fragment>`);
    };
    const water = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -.04;
    scene.add(water);

    /* =========================================================
       INSTANCED MESH HELPER
       ========================================================= */
    const _dummy = new THREE.Object3D();
    const _color = new THREE.Color();

    function makeInstanced(geometry, material, points, config, colorFn) {
      _dummy.userData.fpY = 0;
      const mesh = new THREE.InstancedMesh(geometry, material, points.length);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      points.forEach((p, i) => {
        _dummy.position.set(p[0], p[1] - .08, p[2]);
        _dummy.rotation.set(0, rnd() * TAU, 0);
        _dummy.scale.set(1, 1, 1);
        config && config(_dummy, p);
        _dummy.updateMatrix();
        mesh.setMatrixAt(i, _dummy.matrix);
        if (colorFn) mesh.setColorAt(i, colorFn(_color, p));
      });
      mesh.userData.footprintY = _dummy.userData.fpY;
      scene.add(mesh);
      return mesh;
    }

    function scatterPoints(count, filter) {
      const out = [];
      let attempts = 0;
      while (out.length < count && attempts++ < count * 40) {
        const x = (rnd() - .5) * 2 * (E - 20);
        const z = (rnd() - .5) * 2 * (E - 20);
        const h = heightAt(x, z);
        if (filter(x, z, h)) out.push([x, h, z]);
      }
      return out;
    }

    const slopeAt = (x, z) =>
      Math.abs(heightAt(x + 4, z) - heightAt(x - 4, z)) +
      Math.abs(heightAt(x, z + 4) - heightAt(x, z - 4));

    /* =========================================================
       PALM TREES
       ========================================================= */
    {
      const points = scatterPoints(320, (x, z, h) => h > .6 && h < 4 && !isDesert(x, z) && slopeAt(x, z) < 5);
      const trunkGeo = new THREE.CylinderGeometry(.14, .28, 7, 8, 10);
      trunkGeo.translate(0, 3.5, 0);
      {
        const p = trunkGeo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const y = p.getY(i);
          p.setX(i, p.getX(i) + .04 * y * y);
        }
      }
      const fronds = [];
      for (let i = 0; i < 10; i++) {
        const g = new THREE.PlaneGeometry(.95, 3.9, 1, 7);
        g.translate(0, 1.95, 0);
        g.rotateX(-Math.PI / 2);
        const p = g.attributes.position;
        for (let j = 0; j < p.count; j++) {
          const L = -p.getZ(j);
          p.setY(j, p.getY(j) + .6 * Math.sin(Math.min(L, 1) * 1) - .17 * L * L);
        }
        g.rotateY(i / 10 * TAU + rnd() * .3);
        fronds.push(g);
      }
      const crownGeo = mergeGeometries(fronds);
      const trunkMesh = makeInstanced(
        trunkGeo,
        new THREE.MeshStandardMaterial({ map: barkTex, normalMap: barkNrm, roughness: 1 }),
        points,
        d => { const s = .7 + rnd() * .6; d.scale.setScalar(s); }
      );
      const crownMesh = new THREE.InstancedMesh(
        crownGeo,
        new THREE.MeshStandardMaterial({
          map: frondTex,
          alphaTest: .4,
          transparent: true,
          side: THREE.DoubleSide,
          roughness: .85
        }),
        points.length
      );
      crownMesh.castShadow = true;
      const m4 = new THREE.Matrix4();
      const t4 = new THREE.Matrix4();
      const m4b = new THREE.Matrix4();
      points.forEach((p, i) => {
        trunkMesh.getMatrixAt(i, m4);
        t4.makeTranslation(.04 * 49, 7, 0);
        m4b.copy(m4).multiply(t4);
        crownMesh.setMatrixAt(i, m4b);
        crownMesh.setColorAt(i, _color.setHSL(.24 + rnd() * .05, .50, .34 + rnd() * .10));
      });
      scene.add(crownMesh);
    }

    /* =========================================================
       BAOBAB TREES — distinctive African silhouette
       ========================================================= */
    {
      const points = scatterPoints(90, (x, z, h) =>
        h > .8 && h < 12 && isSavanna(x, z) && !isDesert(x, z) && slopeAt(x, z) < 3
      ).map(p => [...p, .9 + rnd() * .5, rnd() * TAU]);

      // Trunk: wide barrel shape
      const trunkGeo = new THREE.CylinderGeometry(1.6, 2.4, 6, 12, 4);
      trunkGeo.translate(0, 3, 0);
      {
        const p = trunkGeo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
          const n = fbm(x * .3 + y * .2, z * .3, 3) - .5;
          const bulge = 1 + .25 * Math.sin(y / 6 * Math.PI) + n * .2;
          p.setX(i, x * bulge);
          p.setZ(i, z * bulge);
        }
        trunkGeo.computeVertexNormals();
      }

      // Sparse flat-top branches
      const branches = [];
      for (let i = 0; i < 8; i++) {
        const angle = i / 8 * TAU + rnd() * .4;
        const len = 2.5 + rnd() * 2.5;
        const g = new THREE.CylinderGeometry(.22, .5, len, 6);
        g.translate(0, len / 2, 0);
        g.rotateZ(.9);
        g.rotateY(angle);
        g.translate(0, 5.5 + rnd() * 1.5, 0);
        branches.push(g);
      }
      const branchesGeo = mergeGeometries(branches);

      // Sparse canopy: small clusters at branch tips
      const canopyCards = [];
      for (let i = 0; i < 40; i++) {
        const angle = rnd() * TAU;
        const r = 2 + rnd() * 3;
        const y = 8 + rnd() * 2;
        const g = new THREE.PlaneGeometry(1.5 + rnd(), 1.2 + rnd());
        g.rotateX(rnd() * TAU);
        g.rotateY(rnd() * TAU);
        g.translate(Math.cos(angle) * r, y, Math.sin(angle) * r);
        canopyCards.push(g);
      }
      const canopyGeo = mergeGeometries(canopyCards);
      // Add vertex colors
      const cc = new Float32Array(canopyGeo.attributes.position.count * 3);
      for (let i = 0; i < cc.length; i += 3) {
        cc[i] = .55; cc[i + 1] = .60; cc[i + 2] = .35;
      }
      canopyGeo.setAttribute('color', new THREE.BufferAttribute(cc, 3));

      const trunkMat = new THREE.MeshStandardMaterial({
        map: barkTex,
        normalMap: barkNrm,
        roughness: 1,
        color: 0xb89978
      });
      const canopyMat = new THREE.MeshStandardMaterial({
        map: leafCardTex,
        vertexColors: true,
        alphaTest: .45,
        side: THREE.DoubleSide,
        roughness: .85
      });

      makeInstanced(trunkGeo, trunkMat, points, (d, p) => {
        d.scale.setScalar(p[3]);
        d.rotation.y = p[4];
        d.userData.fpY = 0;
      }, c => c.setHSL(.07, .25, .55 + rnd() * .10));

      makeInstanced(branchesGeo, trunkMat, points, (d, p) => {
        d.scale.setScalar(p[3]);
        d.rotation.y = p[4];
      }, c => c.setHSL(.07, .25, .55 + rnd() * .10));

      makeInstanced(canopyGeo, canopyMat, points, (d, p) => {
        d.scale.setScalar(p[3]);
        d.rotation.y = p[4];
      }, c => c.setRGB(.5 + rnd() * .15, .55 + rnd() * .15, .30 + rnd() * .10));
    }

    /* =========================================================
       ACACIA TREES — flat-top savanna silhouette
       ========================================================= */
    {
      const points = scatterPoints(700, (x, z, h) =>
        h > .7 && h < 14 && !isDesert(x, z) && (isSavanna(x, z) || rnd() < .15) && slopeAt(x, z) < 4
      ).map(p => [...p, .9 + rnd() * .5, rnd() * TAU]);

      const trunkGeo = new THREE.CylinderGeometry(.15, .30, 3.5, 6, 2);
      trunkGeo.translate(0, 1.75, 0);

      const branchesGeo = (() => {
        const parts = [];
        for (let i = 0; i < 3; i++) {
          const a = i / 3 * TAU + rnd() * .3;
          const g = new THREE.CylinderGeometry(.08, .18, 2, 5);
          g.translate(0, 1, 0);
          g.rotateZ(.7);
          g.rotateY(a);
          g.translate(0, 3.2, 0);
          parts.push(g);
        }
        return mergeGeometries(parts);
      })();

      const canopyParts = [];
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * TAU;
        const r = .8 + rnd() * 1.6;
        const y = 3.4 + rnd() * .6;
        const g = new THREE.PlaneGeometry(2.4, 1.4, 1, 1);
        g.translate(Math.cos(a) * r, y, Math.sin(a) * r);
        g.rotateY(rnd() * TAU);
        canopyParts.push(g);
      }
      const canopyGeo = mergeGeometries(canopyParts);
      const cc = new Float32Array(canopyGeo.attributes.position.count * 3);
      for (let i = 0; i < cc.length; i += 3) { cc[i] = .50; cc[i + 1] = .58; cc[i + 2] = .34; }
      canopyGeo.setAttribute('color', new THREE.BufferAttribute(cc, 3));

      const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, normalMap: barkNrm, roughness: 1, color: 0x8a7560 });
      const canopyMat = new THREE.MeshStandardMaterial({
        map: leafCardTex,
        vertexColors: true,
        alphaTest: .45,
        side: THREE.DoubleSide,
        roughness: .85
      });

      makeInstanced(trunkGeo, barkMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; });
      makeInstanced(branchesGeo, barkMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; });
      makeInstanced(canopyGeo, canopyMat, points, (d, p) => { d.scale.setScalar(p[3]); d.rotation.y = p[4]; },
        c => c.setRGB(.50 + rnd() * .15, .58 + rnd() * .15, .34 + rnd() * .10));
    }

    /* =========================================================
       BROADLEAF FOREST TREES
       ========================================================= */
    function crownGeometry(lobes, cards) {
      const parts = [];
      lobes.forEach(([lx, ly, lz, R]) => {
        for (let i = 0; i < cards; i++) {
          const u = rnd() * TAU;
          const v = Math.acos(2 * rnd() - 1);
          const rr = R * (.4 + .6 * Math.cbrt(rnd()));
          const x = lx + Math.sin(v) * Math.cos(u) * rr;
          const y = ly + Math.cos(v) * rr * .8;
          const z = lz + Math.sin(v) * Math.sin(u) * rr;
          const g = new THREE.PlaneGeometry(1.8, 1.8);
          g.rotateX(rnd() * TAU);
          g.rotateY(rnd() * TAU);
          g.rotateZ(rnd() * TAU);
          g.translate(x, y, z);
          const b = Math.min(1.1, Math.max(.32, .4 + .55 * (rr / R) + .28 * Math.cos(v)));
          const cs = [];
          const nm = [];
          const nv = new THREE.Vector3(x - lx, (y - ly) * 1.2, z - lz).normalize();
          for (let k = 0; k < 4; k++) {
            cs.push(b, b, b * .9);
            nm.push(nv.x, nv.y, nv.z);
          }
          g.setAttribute('color', new THREE.Float32BufferAttribute(cs, 3));
          g.setAttribute('normal', new THREE.Float32BufferAttribute(nm, 3));
          parts.push(g);
        }
      });
      return mergeGeometries(parts);
    }

    function trunkGeometry(lobes) {
      const parts = [];
      const main = new THREE.CylinderGeometry(.12, .36, 3.4, 7, 3);
      main.translate(0, 1.7, 0);
      parts.push(main);
      lobes.slice(1).forEach(([x, y, z]) => {
        const dir = new THREE.Vector3(x, y - 1, z).sub(new THREE.Vector3(0, 2.4, 0));
        const len = dir.length();
        const g = new THREE.CylinderGeometry(.035, .09, len, 5, 1);
        g.translate(0, len / 2, 0);
        g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()));
        g.translate(0, 2.4, 0);
        parts.push(g);
      });
      return mergeGeometries(parts);
    }

    function coreGeometry(lobes) {
      return mergeGeometries(lobes.map(([x, y, z, R]) => {
        const g = new THREE.IcosahedronGeometry(1, 1);
        g.scale(R * .62, R * .5, R * .62);
        g.translate(x, y, z);
        return g;
      }));
    }

    {
      const points = scatterPoints(1600, (x, z, h) =>
        h > .9 && h < 18 && !isDesert(x, z) && slopeAt(x, z) < 4 &&
        (isForest(x, z) || rnd() < .30)
      ).map(p => [...p, .85 + rnd() * .7, rnd() * TAU]);

      const barkMat = new THREE.MeshStandardMaterial({
        map: barkTex,
        normalMap: barkNrm,
        normalScale: new THREE.Vector2(1.2, 1.2),
        roughness: 1
      });
      const coreMat = new THREE.MeshStandardMaterial({ color: 0x1a2f12, roughness: 1 });
      const leafMat = new THREE.MeshStandardMaterial({
        map: leafCardTex,
        vertexColors: true,
        alphaTest: .45,
        side: THREE.DoubleSide,
        roughness: .82
      });

      for (let v = 0; v < 3; v++) {
        const jitter = () => (rnd() - .5) * .6;
        const lobes = [
          [0, 3.9, 0, 1.9],
          [1.2 + jitter(), 3.3, .4 + jitter(), 1.3],
          [-1.1 + jitter(), 3.4, -.5 + jitter(), 1.35],
          [.2 + jitter(), 5.1, .1 + jitter(), 1.2],
          [.2 + jitter(), 3.1, -1.2 + jitter(), 1.1]
        ];
        const part = points.filter((_, i) => i % 3 === v);

        makeInstanced(trunkGeometry(lobes), barkMat, part, (d, p) => {
          d.rotation.y = p[4];
          d.scale.setScalar(p[3]);
        });

        const crown = makeInstanced(crownGeometry(lobes, 42), leafMat, part, (d, p) => {
          d.rotation.y = p[4];
          d.scale.setScalar(p[3]);
        }, c => c.setRGB(.45 + rnd() * .15, .62 + rnd() * .15, .34 + rnd() * .10));
        crown.castShadow = false;

        makeInstanced(coreGeometry(lobes), coreMat, part, (d, p) => {
          d.rotation.y = p[4];
          d.scale.setScalar(p[3]);
        });
      }
    }

    /* =========================================================
       BUSHES AND SHRUBS
       ========================================================= */
    {
      const points = scatterPoints(3000, (x, z, h) =>
        h > .5 && h < 14 && !isDesert(x, z) && slopeAt(x, z) < 5
      );
      const bushGeo = new THREE.IcosahedronGeometry(.8, 1);
      const bushMat = new THREE.MeshStandardMaterial({
        map: leafTex,
        normalMap: terrainNrm,
        roughness: 1
      });
      makeInstanced(bushGeo, bushMat, points, d => {
        const s = .4 + rnd() * 1.1;
        d.scale.set(s, s * .7, s);
      }, c => c.setHSL(.22 + rnd() * .08, .55, .26 + rnd() * .12));
    }

    /* =========================================================
       ROCKS
       ========================================================= */
    {
      const rockGeo = new THREE.DodecahedronGeometry(1, 1);
      {
        const p = rockGeo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const k = 1 + (hs(p.getX(i) * 7, p.getZ(i) * 7 + p.getY(i) * 3) - .5) * .5;
          p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k);
        }
        rockGeo.computeVertexNormals();
      }
      const points = scatterPoints(0, (x, z, h) =>
        h > 12 ? rnd() < .7 : (h > -.4 && h < 15 && rnd() < .04)
      );
      makeInstanced(rockGeo, new THREE.MeshStandardMaterial({
        map: rockTex,
        normalMap: rockNrm,
        roughness: 1
      }), points, (d, p) => {
        const s = .6 + rnd() * (p[1] > 12 ? 4 : 1.8);
        d.scale.set(s, s * .7, s);
        d.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
      }, c => c.setScalar(.75 + rnd() * .4));
    }

    /* =========================================================
       GRASS
       ========================================================= */
    const windUniform = { value: 0 };

    {
      const blades = [];
      for (let i = 0; i < 3; i++) {
        const p = new THREE.PlaneGeometry(1.1, 1);
        p.translate(0, .5, 0);
        p.rotateY(i * Math.PI / 3);
        blades.push(p);
      }
      const grassGeo = mergeGeometries(blades);
      const points = scatterPoints(20000, (x, z, h) =>
        h > .55 && h < 14 && !isDesert(x, z) && slopeAt(x, z) < 4 && rnd() < .9
      );
      const grassMat = new THREE.MeshStandardMaterial({
        map: grassTex,
        alphaTest: .45,
        side: THREE.DoubleSide,
        roughness: 1
      });
      const mesh = makeInstanced(grassGeo, grassMat, points,
        d => d.scale.setScalar(.5 + rnd() * .9),
        c => c.setHSL(.20 + rnd() * .10, .45, .55 + rnd() * .15)
      );
      mesh.castShadow = false;
    }

    /* =========================================================
       WIND ANIMATION FOR FOLIAGE
       ========================================================= */
    function applyWind(material, base = 0, amp = 1) {
      const hasAlpha = material.alphaTest > 0;
      material.customProgramCacheKey = () => 'wind-' + base + '-' + amp + '-' + hasAlpha;
      material.onBeforeCompile = shader => {
        shader.uniforms.uWind = windUniform;
        shader.vertexShader = 'uniform float uWind;\n' + shader.vertexShader.replace(
          '#include <begin_vertex>',
          `#include <begin_vertex>
#ifdef USE_INSTANCING
vec3 wp = instanceMatrix[3].xyz;
float gu = .55 + .45 * sin(uWind * .9 - (wp.x * .7 + wp.z * .4) * .06) + .25 * sin(uWind * 2.3 + wp.x * .13 + wp.z * .1);
float hh = max(position.y, 0.) + ${base.toFixed(2)};
transformed += inverse(mat3(instanceMatrix)) * vec3(.92, 0., .39) * gu * hh * ${(.06 * amp).toFixed(3)};
${hasAlpha ? 'transformed += vec3(sin(uWind*7.+position.x*6.+wp.z), sin(uWind*8.3+position.z*6.+wp.x), sin(uWind*6.1+position.y*6.)) * .03 * (.4 + gu);' : ''}
#endif`
        );
      };
    }

    scene.traverse(o => {
      if (!o.isInstancedMesh || !o.count || o.material.map === rockTex) return;
      applyWind(o.material, o.material.map === frondTex ? 7 : (o.userData.footprintY || 0), 1);
    });

    /* =========================================================
       CLOUDS AND BIRDS
       ========================================================= */
    const clouds = [];
    for (let i = 0; i < 60; i++) {
      const cx = (rnd() - .5) * 4000;
      const cz = (rnd() - .5) * 4000;
      const cy = 400 + rnd() * 150;
      for (let j = 0; j < 6; j++) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({
          map: cloudTex,
          transparent: true,
          depthWrite: false,
          fog: false,
          opacity: .85
        }));
        s.scale.set(280 + rnd() * 200, 90 + rnd() * 50, 1);
        s.position.set(cx + (rnd() - .5) * 260, cy + (rnd() - .5) * 15, cz + (rnd() - .5) * 140);
        scene.add(s);
        clouds.push(s);
      }
    }

    const birds = [];
    for (let i = 0; i < 20; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: birdTex,
        transparent: true,
        depthWrite: false
      }));
      s.scale.set(6, 3, 1);
      scene.add(s);
      birds.push(s);
    }

    /* =========================================================
       PLAYER CHARACTER
       ========================================================= */
    const mkMat = (c, r = .8) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
    const man = new THREE.Group();
    const procMan = new THREE.Group();
    man.add(procMan);

    const skinMat = mkMat(0xd2a07a, .55);
    const shirtMat = new THREE.MeshStandardMaterial({ map: clothTex, color: 0xf2efe8, roughness: .9 });
    const pantsMat = new THREE.MeshStandardMaterial({ map: clothTex, color: 0x59616f, roughness: .9 });
    const hairMat = mkMat(0x2a2018, 1);

    const makeLimb = (mat, r, len, y, x) => {
      const g = new THREE.Group();
      g.position.set(x, y, 0);
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 8), mat);
      m.position.y = -len / 2 - .05;
      m.castShadow = true;
      g.add(m);
      procMan.add(g);
      return g;
    };

    const legL = makeLimb(pantsMat, .075, .78, .92, -.11);
    const legR = makeLimb(pantsMat, .075, .78, .92, .11);
    const armL = makeLimb(shirtMat, .052, .6, 1.5, -.3);
    const armR = makeLimb(shirtMat, .052, .6, 1.5, .3);

    {
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.2, .5, 4, 10), shirtMat);
      torso.position.y = 1.25;
      torso.scale.z = .7;
      torso.castShadow = true;
      const head = new THREE.Mesh(new THREE.SphereGeometry(.14, 16, 12), skinMat);
      head.position.y = 1.78;
      head.scale.y = 1.12;
      head.castShadow = true;
      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(.15, 14, 10, 0, TAU, 0, Math.PI * .55),
        hairMat
      );
      hair.position.y = 1.8;
      hair.rotation.x = -.25;
      hair.castShadow = true;
      procMan.add(torso, head, hair);
    }

    man.position.set(80, heightAt(80, 505), 505);
    man.rotation.y = Math.PI;
    scene.add(man);

    const targetMarker = new THREE.Mesh(
      new THREE.RingGeometry(.5, .8, 24),
      new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: .85, depthWrite: false })
    );
    targetMarker.rotation.x = -Math.PI / 2;
    targetMarker.visible = false;
    scene.add(targetMarker);

    let walkTarget = null;
    let walkPhase = 0;

    function setWalkTarget(x, z) {
      walkTarget = { x, z };
      targetMarker.position.set(x, heightAt(x, z) + .12, z);
      targetMarker.visible = true;
      flyCam = null;
    }

    function updateMan(dt) {
      let moveDir = null;
      let running = keys.shift;

      if (keys.w || keys.a || keys.s || keys.d) {
        camera.getWorldDirection(camForward);
        camForward.y = 0;
        camForward.normalize();
        camRight.crossVectors(camera.up, camForward).normalize();
        moveVec.set(0, 0, 0);
        if (keys.w) moveVec.add(camForward);
        if (keys.s) moveVec.sub(camForward);
        if (keys.d) moveVec.add(camRight);
        if (keys.a) moveVec.sub(camRight);
        if (moveVec.lengthSq()) {
          moveDir = moveVec.normalize();
          walkTarget = null;
          targetMarker.visible = false;
        }
      } else if (walkTarget) {
        const dx = walkTarget.x - man.position.x;
        const dz = walkTarget.z - man.position.z;
        const d = Math.hypot(dx, dz);
        if (d < .6) {
          walkTarget = null;
          targetMarker.visible = false;
        } else {
          moveDir = moveVec.set(dx / d, 0, dz / d);
          if (d > 60) running = true;
        }
      }

      if (moveDir) {
        const speed = running ? 22 : 12;
        const nx = THREE.MathUtils.clamp(man.position.x + moveDir.x * speed * dt, -E + 15, E - 15);
        const nz = THREE.MathUtils.clamp(man.position.z + moveDir.z * speed * dt, -E + 15, E - 15);
        const nh = heightAt(nx, nz);
        if (nh > -.4 && nh - heightAt(man.position.x, man.position.z) < speed * dt * 2.5) {
          man.position.x = nx;
          man.position.z = nz;
        } else {
          walkTarget = null;
          targetMarker.visible = false;
        }
        let da = Math.atan2(moveDir.x, moveDir.z) - man.rotation.y;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        man.rotation.y += da * Math.min(1, dt * 10);
        walkPhase += dt * speed * 1.5;
        const s = Math.sin(walkPhase) * (running ? .9 : .6);
        legL.rotation.x = s;
        legR.rotation.x = -s;
        armL.rotation.x = -s * .8;
        armR.rotation.x = s * .8;
      } else {
        [legL, legR, armL, armR].forEach(l => l.rotation.x *= .85);
      }

      man.position.y = Math.max(heightAt(man.position.x, man.position.z), -.3) +
        (moveDir ? Math.abs(Math.sin(walkPhase)) * .04 : 0);
    }

    /* =========================================================
       MAP RENDERING
       ========================================================= */
    const baseMap = document.createElement('canvas');
    baseMap.width = baseMap.height = 800;
    {
      const g = baseMap.getContext('2d');
      const img = g.createImageData(800, 800);
      for (let j = 0; j < 800; j++) for (let i = 0; i < 800; i++) {
        const x = (i / 800 - .5) * 2 * E;
        const z = (j / 800 - .5) * 2 * E;
        const h = heightAt(x, z);
        let c;
        if (h < -.15) {
          const k = smooth(0, 8, -h);
          c = [.14 - .08 * k, .38 - .22 * k, .58 - .18 * k];
        } else {
          c = groundColor(x, z, h, h > 30 ? .5 : 1);
          const shade = (heightAt(x - 3, z - 3) - heightAt(x + 3, z + 3)) * .03;
          c = c.map(v => Math.min(1, Math.max(0, v + shade)));
        }
        const o = (j * 800 + i) * 4;
        img.data[o] = c[0] * 255;
        img.data[o + 1] = c[1] * 255;
        img.data[o + 2] = c[2] * 255;
        img.data[o + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }

    const worldToMap = (v, S) => (v / E + 1) / 2 * S;

    function drawMap(canvas, isBig) {
      const S = canvas.width;
      const g = canvas.getContext('2d');
      g.drawImage(baseMap, 0, 0, S, S);

      if (isBig) {
        g.font = '600 ' + S / 130 + 'px Poppins';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.lineWidth = 3;
        g.strokeStyle = 'rgba(20,14,6,.85)';
        g.fillStyle = '#fff3d4';
        COUNTRIES.forEach(([name, x, z]) => {
          g.strokeText(name, worldToMap(x, S), worldToMap(z, S));
          g.fillText(name, worldToMap(x, S), worldToMap(z, S));
        });
      }

      const px = worldToMap(controls.target.x, S);
      const py = worldToMap(controls.target.z, S);
      g.fillStyle = '#fff';
      g.strokeStyle = '#d62b1b';
      g.lineWidth = isBig ? 4 : 3;
      g.beginPath();
      g.arc(px, py, isBig ? S / 90 : S / 60, 0, TAU);
      g.fill();
      g.stroke();

      const a = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
      g.beginPath();
      g.moveTo(px, py);
      g.lineTo(px - Math.sin(a) * S / 22, py - Math.cos(a) * S / 22);
      g.stroke();
    }

    const mini = document.getElementById('mini');
    const mc = document.getElementById('mc');
    const mapEl = document.getElementById('map');

    const clickMap = (cv, e, cb) => {
      const r = cv.getBoundingClientRect();
      const wx = ((e.clientX - r.left) / r.width * 2 - 1) * E;
      const wz = ((e.clientY - r.top) / r.height * 2 - 1) * E;
      cb(wx, wz);
    };

    const toggleMap = force => mapEl.classList.toggle('on', force);

    mini.onclick = e => clickMap(mini, e, (x, z) => flyTo(x, z, 350));
    mc.onclick = e => clickMap(mc, e, (x, z) => { toggleMap(false); flyTo(x, z, 250); });
    mapEl.onclick = e => { if (e.target === mapEl) toggleMap(false); };

    /* =========================================================
       NAVIGATION
       ========================================================= */
    let flyCam = null;

    function flyTo(x, z, dist = 250) {
      x = THREE.MathUtils.clamp(x, -E + 20, E - 20);
      z = THREE.MathUtils.clamp(z, -E + 20, E - 20);
      if (heightAt(x, z) < -.3) return;
      man.position.set(x, heightAt(x, z), z);
      walkTarget = null;
      targetMarker.visible = false;
      const y = Math.max(heightAt(x, z), 0) + 2;
      const to = new THREE.Vector3(x, y, z);
      const dir = new THREE.Vector3(
        camera.position.x - controls.target.x,
        0,
        camera.position.z - controls.target.z
      ).normalize();
      flyCam = {
        t: 0,
        fromTarget: controls.target.clone(),
        fromCam: camera.position.clone(),
        toTarget: to,
        toCam: to.clone().addScaledVector(dir, dist).setY(y + dist * .55)
      };
    }

    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let downPos = null;

    renderer.domElement.addEventListener('pointerdown', e => downPos = [e.clientX, e.clientY]);
    renderer.domElement.addEventListener('pointerup', e => {
      if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 5) return;
      mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObject(terrain)[0];
      if (hit && hit.point.y > -.3) setWalkTarget(hit.point.x, hit.point.z);
    });

    const keys = {};
    const keyMap = { arrowup: 'w', arrowdown: 's', arrowleft: 'a', arrowright: 'd' };

    addEventListener('keydown', e => {
      let k = e.key.toLowerCase();
      if (keyMap[k]) { e.preventDefault(); k = keyMap[k]; }
      keys.shift = e.shiftKey;
      if ('wasd'.includes(k) && k.length === 1) keys[k] = 1;
      if (k === 'm') toggleMap();
      if (k === 'escape') toggleMap(false);
    });
    addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      keys[keyMap[k] || k] = 0;
      keys.shift = e.shiftKey;
    });

    const camForward = new THREE.Vector3();
    const camRight = new THREE.Vector3();
    const moveVec = new THREE.Vector3();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    /* =========================================================
       MAIN LOOP
       ========================================================= */
    const clock = new THREE.Clock();
    let mapTimer = 0;
    let lastLoc = '';
    const locEl = document.getElementById('loc');

    function nearestCountry(x, z) {
      let best = COUNTRIES[0][0];
      let bestD = Infinity;
      COUNTRIES.forEach(([name, cx, cz]) => {
        const d = Math.hypot(x - cx, z - cz);
        if (d < bestD) { bestD = d; best = name; }
      });
      return best[0] + best.slice(1).toLowerCase().replace(/\b\w/g, s => s);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .05);
      const t = clock.elapsedTime;

      if (flyCam) {
        flyCam.t = Math.min(1, flyCam.t + dt / 1.8);
        const k = flyCam.t * flyCam.t * (3 - 2 * flyCam.t);
        controls.target.lerpVectors(flyCam.fromTarget, flyCam.toTarget, k);
        camera.position.lerpVectors(flyCam.fromCam, flyCam.toCam, k);
        if (flyCam.t >= 1) flyCam = null;
      }

      updateMan(dt);

      if (!flyCam) {
        const k = Math.min(1, dt * 6);
        const ax = (man.position.x - controls.target.x) * k;
        const ay = (man.position.y + 2 - controls.target.y) * k;
        const az = (man.position.z - controls.target.z) * k;
        camera.position.x += ax;
        camera.position.y += ay;
        camera.position.z += az;
        controls.target.x += ax;
        controls.target.y += ay;
        controls.target.z += az;
      }

      if (camera.position.y < heightAt(camera.position.x, camera.position.z) + 4) {
        camera.position.y = heightAt(camera.position.x, camera.position.z) + 4;
      }

      sun.target.position.set(
        Math.round(controls.target.x / 4) * 4,
        0,
        Math.round(controls.target.z / 4) * 4
      );
      sun.position.copy(sun.target.position).addScaledVector(sunDir, 500);

      windUniform.value = t;
      waterUniforms.uTime.value = t;

      clouds.forEach(s => {
        s.position.x += dt * 8;
        s.position.z += dt * 3;
        if (s.position.x > 2200) s.position.x -= 4400;
        if (s.position.z > 2200) s.position.z -= 4400;
      });

      birds.forEach((s, i) => {
        const a = t * .08 + i * 1.05;
        const r = 350 + 60 * Math.sin(i * 3.7);
        s.position.set(Math.cos(a) * r, 160 + 20 * Math.sin(t * .23 + i * 2), Math.sin(a) * r);
        s.material.rotation = Math.sin(t * 1.5 + i) * .25;
      });

      waterNrm.offset.x = t * .004;
      waterNrm.offset.y = t * .0025;

      controls.update();
      renderer.render(scene, camera);

      mapTimer += dt;
      if (mapTimer > .2) {
        mapTimer = 0;
        drawMap(mini, false);
        if (mapEl.classList.contains('on')) drawMap(mc, true);
        const loc = nearestCountry(controls.target.x, controls.target.z);
        if (loc !== lastLoc) {
          lastLoc = loc;
          locEl.textContent = loc;
        }
      }
    }

    animate();

    const ld = document.getElementById('ld');
    setTimeout(() => {
      ld.style.opacity = 0;
      setTimeout(() => ld.remove(), 900);
    }, 500);
  </script>
</body>
</html>
