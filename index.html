<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anas Ahmed · 3D Game Developer — Survival Island</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel: rgba(28, 20, 11, .74);
      --fg: #f3e6c8;
      --ac: #e2ad55;
      --line: rgba(243, 230, 200, .22);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #8fb1c9;
      font-family: Poppins, system-ui, sans-serif;
      color: var(--fg)
    }

    .p {
      position: absolute;
      z-index: 20;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      backdrop-filter: blur(6px)
    }

    #id {
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 10px;
      padding: 8px 14px
    }

    #id b {
      font-size: 1.05rem;
      letter-spacing: .06em
    }

    #id span {
      display: block;
      font-size: .72rem;
      opacity: .8
    }

    #side {
      top: calc(10px + env(safe-area-inset-top, 0px));
      right: 10px;
      padding: 8px;
      width: 176px
    }

    #mini {
      display: block;
      width: 160px;
      height: 160px;
      border-radius: 6px;
      cursor: pointer
    }

    #list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    button {
      font: 600 .74rem Poppins, sans-serif;
      color: var(--fg);
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 8px;
      text-align: left;
      cursor: pointer
    }

    button:hover {
      background: rgba(226, 173, 85, .28)
    }

    button i {
      font-style: normal;
      opacity: .65;
      font-weight: 400;
      display: block;
      font-size: .66rem
    }

    #bar {
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      padding: 7px 14px;
      font-size: .76rem;
      display: flex;
      gap: 14px;
      align-items: center;
      white-space: nowrap
    }

    kbd {
      background: rgba(255, 255, 255, .14);
      border-radius: 4px;
      padding: 1px 6px;
      font: 700 .72rem Poppins
    }

    #loc {
      left: 10px;
      top: calc(62px + env(safe-area-inset-top, 0px));
      padding: 5px 12px;
      font-size: .78rem;
      color: var(--ac);
      font-weight: 600
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(10, 8, 5, .82);
      display: none;
      align-items: center;
      justify-content: center
    }

    #map.on {
      display: flex
    }

    #mc {
      width: min(92vw, 86vh);
      height: min(92vw, 86vh);
      border-radius: 12px;
      border: 2px solid var(--ac);
      cursor: pointer
    }

    #ld {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: grid;
      place-items: center;
      background: #dfe9ee;
      color: #2b4152;
      font-weight: 600;
      transition: opacity .9s
    }

    @media(max-width:700px) {

      #list,
      #bar span.h {
        display: none
      }

      #side {
        width: auto
      }

      #mini {
        width: 110px;
        height: 110px
      }
    }
  </style>
</head>

<body>
  <div id="id" class="p"><b>SURVIVAL ISLAND</b><span>by Anas Ahmed</span></div>
  <div id="loc" class="p">Western Beach</div>
  <div id="side" class="p"><canvas id="mini" width="320" height="320"></canvas>
    <div id="list"></div>
  </div>
  <div id="bar" class="p"><span class="h"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span
      class="h"><b>click</b> ground to walk · <kbd>Shift</kbd> run · drag to look · scroll to
      zoom</span><span><kbd>M</kbd> full map</span></div>
  <div id="map"><canvas id="mc" width="900" height="900"></canvas></div>
  <div id="ld">Shaping the island…</div>

  <script
    type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

    const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x) };

    /* ===== WORLD: island layout follows the Island Castaway reference map ===== */

    }

    /* ===== RENDERER / SKY ===== */
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .55; renderer.outputColorSpace = THREE.SRGBColorSpace;

    Object.assign(ctl, { enableDamping: true, dampingFactor: .06, maxPolarAngle: Math.PI / 2.05, minDistance: 5, maxDistance: 260, enablePan: false });
    ctl.target.set(-62, 2, 64);

    su.turbidity.value = 3.5; su.rayleigh.value = 1.3; su.mieCoefficient.value = .004; su.mieDirectionalG.value = .82;
    const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(58), THREE.MathUtils.degToRad(150));

    scene.fog = new THREE.FogExp2(0xb9d0de, .0019);

    /* ===== TEXTURES ===== */
    function noiseTex(base, cols, n, rep, sz = 256) {

      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8; return t;
    }

    const barkTex = noiseTex('#6a5640', ['#4c3c2a', '#85705a', '#3a2c1e'], 1200, 1);
    const rockTex = noiseTex('#8a857b', ['#6f6a60', '#a39e92', '#59544b'], 1500, 2);
    const frondTex = (() => {
      const c = document.createElement('canvas'); c.width = 128; c.height = 512; const g = c.getContext('2d');
      g.strokeStyle = '#4f6b2a'; g.lineWidth = 5; g.beginPath(); g.moveTo(64, 512); g.lineTo(64, 6); g.stroke();
      for (let i = 0; i < 44; i++) {
        const t = i / 44, y = 500 - t * 480, L = 52 * (.35 + Math.sin(t * 3.0 + .2) * .65 + .1); g.strokeStyle = ['#3f6d2a', '#4d7d32', '#366226'][i % 3]; g.lineWidth = 4;

    const waterN = (() => {

      const hh = (x, y) => Math.sin(x * a * 4 + Math.sin(y * a * 2) * 2) + Math.sin(y * a * 6 + x * a) * .5 + Math.sin((x + y) * a * 8) * .3 + Math.sin((x - y) * a * 13) * .15;
      for (let y = 0; y < S; y++)for (let x = 0; x < S; x++) {

      g.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(160, 160); return t

    const SEG = 260, geo = new THREE.PlaneGeometry(E * 2, E * 2, SEG, SEG); geo.rotateX(-Math.PI / 2);
    {

    const water = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshPhysicalMaterial({ color: 0x1b7f98, roughness: .06, metalness: 0, transparent: true, opacity: .8, normalMap: waterN, normalScale: new THREE.Vector2(.5, .5), envMapIntensity: 1.2 }));

    /* ===== VEGETATION & ROCKS (instanced) ===== */
    function scatter(n, f) { const o = []; let t = 0; while (o.length < n && t++ < n * 60) { const x = (rnd() - .5) * 2 * (E - 6), z = (rnd() - .5) * 2 * (E - 6), h = H(x, z); if (f(x, z, h)) o.push([x, h, z]) } return o }
    const slope = (x, z) => Math.abs(H(x + 1.5, z) - H(x - 1.5, z)) + Math.abs(H(x, z + 1.5) - H(x, z - 1.5));
    const D = new THREE.Object3D(), C = new THREE.Color();

    }
    const forestOK = (x, z) => fbm(x * .02 + 3, z * .02, 3) > .4;
    // broadleaf trees
    {
      const tr = scatter(0, (x, z, h) => h > .9 && h < 10 && !inSw(x, z) && forestOK(x, z) && slope(x, z) < 2.2 && rnd() < .9);
      const trunk = new THREE.CylinderGeometry(.16, .3, 1, 7); trunk.translate(0, .5, 0);
      const parts = [];[[0, 0, 0, 1.5], [.9, -.5, .3, 1.1], [-.8, -.6, -.4, 1.15], [.1, .9, .2, 1.0]].forEach(([x, y, z, r]) => {

    }

    {

      const tg = new THREE.CylinderGeometry(.14, .26, 7, 8, 10); tg.translate(0, 3.5, 0); { const p = tg.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) + .035 * y * y) } }
      const fr = []; for (let i = 0; i < 9; i++) {
        const g = new THREE.PlaneGeometry(.95, 3.7, 1, 7); g.translate(0, 1.85, 0); g.rotateX(-Math.PI / 2); const p = g.attributes.position;
        for (let j = 0; j < p.count; j++) { const L = -p.getZ(j); p.setY(j, p.getY(j) + .6 * Math.sin(Math.min(L, 1) * 1) - .16 * L * L) }

      const cm = new THREE.InstancedMesh(crown, new THREE.MeshStandardMaterial({ map: frondTex, alphaTest: .4, transparent: true, side: THREE.DoubleSide, roughness: .9 }), pm.length); cm.castShadow = true;

    // bushes & ferns

    // rocks
    const rg = new THREE.DodecahedronGeometry(1, 1); { const p = rg.attributes.position; for (let i = 0; i < p.count; i++) { const k = 1 + (hs(p.getX(i) * 7, p.getZ(i) * 7 + p.getY(i) * 3) - .5) * .5; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k) } rg.computeVertexNormals() }
    inst(rg, new THREE.MeshStandardMaterial({ map: rockTex, roughness: 1 }), scatter(0, (x, z, h) => h > 7 ? rnd() < .7 : (h > -.4 && h < 9 && rnd() < .05)), (d, p) => { const s = .5 + rnd() * (p[1] > 9 ? 3.2 : 1.4); d.scale.set(s, s * .7, s); d.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3) }, (c) => c.setScalar(.7 + rnd() * .5));

    /* ===== BANANA & ORANGE TREES ===== */
    const fp = (d, p, y) => { d.rotation.y = p[4]; d.scale.setScalar(p[3]); d.position.y += y * p[3] };

    /* ===== VOLUMETRIC BROADLEAF TREES (leaf-card crowns, branches, shaded core) ===== */

      const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');

    function crownGeo(lobes, cards) {

      const S = cv.width, g = cv.getContext('2d'); g.drawImage(base, 0, 0, S, S);
      if (big) { g.font = '700 ' + S / 46 + 'px Poppins'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = 'rgba(20,14,6,.8)'; g.fillStyle = '#fff3d4'; RG.forEach(([n, x, z]) => { g.strokeText(n, w2m(x, S), w2m(z, S)); g.fillText(n, w2m(x, S), w2m(z, S)) }) }
      PO.forEach(d => {
        const x = w2m(d.x, S), y = w2m(d.z, S), r = big ? S / 60 : S / 45; g.fillStyle = d.c; g.strokeStyle = '#fff'; g.lineWidth = big ? 3 : 2; g.beginPath(); g.arc(x, y, r, 0, T); g.fill(); g.stroke();
        if (big) { g.font = '600 ' + S / 58 + 'px Poppins'; g.fillStyle = '#fff'; g.strokeStyle = 'rgba(0,0,0,.8)'; g.lineWidth = 4; g.strokeText(d.t, x, y + r * 2.4); g.fillText(d.t, x, y + r * 2.4) }
      });
      const px = w2m(ctl.target.x, S), py = w2m(ctl.target.z, S); g.fillStyle = '#fff'; g.strokeStyle = '#d62b1b'; g.lineWidth = big ? 4 : 3; g.beginPath(); g.arc(px, py, big ? S / 90 : S / 60, 0, T); g.fill(); g.stroke();
      const a = Math.atan2(camera.position.x - ctl.target.x, camera.position.z - ctl.target.z); g.beginPath(); g.moveTo(px, py); g.lineTo(px - Math.sin(a) * S / 22, py - Math.cos(a) * S / 22); g.stroke()
    }
    const mini = document.getElementById('mini'), mc = document.getElementById('mc'), mapEl = document.getElementById('map');
    const clickMap = (cv, e, cb) => { const r = cv.getBoundingClientRect(), wx = ((e.clientX - r.left) / r.width * 2 - 1) * E, wz = ((e.clientY - r.top) / r.height * 2 - 1) * E; cb(wx, wz) };
    function nearestPoster(x, z, rad) { let b = null, bd = rad; PO.forEach(d => { const k = Math.hypot(d.x - x, d.z - z); if (k < bd) { bd = k; b = d } }); return b }
    const toggleMap = f => mapEl.classList.toggle('on', f);
    mini.onclick = e => clickMap(mini, e, (x, z) => flyTo(x, z, 70));
    mc.onclick = e => clickMap(mc, e, (x, z) => { const p = nearestPoster(x, z, 10); toggleMap(false); p ? flyPoster(p) : flyTo(x, z, 60) });
    mapEl.onclick = e => { if (e.target === mapEl) toggleMap(false) };

    /* ===== NAVIGATION ===== */
    let fly = null;
    function flyTo(x, z, dist = 60) {
      x = THREE.MathUtils.clamp(x, -E + 8, E - 8); z = THREE.MathUtils.clamp(z, -E + 8, E - 8); if (H(x, z) < -.3) return; man.position.set(x, H(x, z), z); manT = null; mark.visible = false; const y = Math.max(H(x, z), 0) + 1.5; const to = new THREE.Vector3(x, y, z), dir = new THREE.Vector3(camera.position.x - ctl.target.x, 0, camera.position.z - ctl.target.z).normalize();
      fly = { t: 0, fT: ctl.target.clone(), fC: camera.position.clone(), tT: to, tC: to.clone().addScaledVector(dir, dist).setY(y + dist * .55) }
    }
    function flyPoster(p) {
      const dir = new THREE.Vector3(-p.x, 0, -p.z).normalize(), to = new THREE.Vector3(p.x, p.y + 2.9, p.z); man.position.set(p.x + dir.x * 3.2, p.y, p.z + dir.z * 3.2); man.rotation.y = Math.atan2(-dir.x, -dir.z); manT = null; mark.visible = false;
      fly = { t: 0, fT: ctl.target.clone(), fC: camera.position.clone(), tT: to, tC: to.clone().addScaledVector(dir, 7).setY(p.y + 3.6) }
    }
    const rc = new THREE.Raycaster(), mv = new THREE.Vector2(); let dn = null;
    renderer.domElement.addEventListener('pointerdown', e => dn = [e.clientX, e.clientY]);
    renderer.domElement.addEventListener('pointerup', e => {
      if (!dn || Math.hypot(e.clientX - dn[0], e.clientY - dn[1]) > 5) return; mv.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); rc.setFromCamera(mv, camera);
      const h = rc.intersectObjects(PO.map(p => p.pl))[0]; if (h) { const p = PO.find(q => q.pl === h.object), dr = new THREE.Vector3(-p.x, 0, -p.z).normalize(); setT(p.x + dr.x * 3.5, p.z + dr.z * 3.5); return }
      const g = rc.intersectObject(terrain)[0]; if (g && g.point.y > -.3) setT(g.point.x, g.point.z)
    });
    const keys = {}; addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys.shift = e.shiftKey; if ('wasd'.includes(k) && k.length == 1) keys[k] = 1; if (k === 'm') toggleMap(); if (k === 'escape') toggleMap(false) });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; keys.shift = e.shiftKey });
    const fw = new THREE.Vector3(), rt = new THREE.Vector3(), mvv = new THREE.Vector3();
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight) });

    /* ===== LOOP ===== */
    const clock = new THREE.Clock(); let mt = 0, lastLoc = ''; const locEl = document.getElementById('loc');
    function nameAt(x, z) { let b = RG[0][0], bd = 1e9; RG.forEach(([n, a, c]) => { const d = Math.hypot(x - a, z - c); if (d < bd) { bd = d; b = n } }); return b[0] + b.slice(1).toLowerCase().replace(/\b\w/g, s => s) }
    function loop() {
      requestAnimationFrame(loop); const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
      if (fly) { fly.t = Math.min(1, fly.t + dt / 1.8); const k = fly.t * fly.t * (3 - 2 * fly.t); ctl.target.lerpVectors(fly.fT, fly.tT, k); camera.position.lerpVectors(fly.fC, fly.tC, k); if (fly.t >= 1) fly = null }
      else if (false) {
        camera.getWorldDirection(fw); fw.y = 0; fw.normalize(); rt.crossVectors(fw, camera.up).normalize(); mvv.set(0, 0, 0);
        if (keys.w) mvv.add(fw); if (keys.s) mvv.sub(fw); if (keys.d) mvv.add(rt); if (keys.a) mvv.sub(rt);
        if (mvv.lengthSq()) { mvv.normalize().multiplyScalar(26 * dt); const nx = THREE.MathUtils.clamp(ctl.target.x + mvv.x, -E + 6, E - 6), nz = THREE.MathUtils.clamp(ctl.target.z + mvv.z, -E + 6, E - 6); mvv.set(nx - ctl.target.x, 0, nz - ctl.target.z); camera.position.add(mvv); ctl.target.add(mvv) }
      }
      stepMan(dt); if (!fly) { const k = Math.min(1, dt * 6), ax = (man.position.x - ctl.target.x) * k, ay = (man.position.y + 1.5 - ctl.target.y) * k, az = (man.position.z - ctl.target.z) * k; camera.position.x += ax; camera.position.y += ay; camera.position.z += az; ctl.target.x += ax; ctl.target.y += ay; ctl.target.z += az }
      if (camera.position.y < H(camera.position.x, camera.position.z) + 2) camera.position.y = H(camera.position.x, camera.position.z) + 2;
      sun.target.position.set(Math.round(ctl.target.x / 4) * 4, 0, Math.round(ctl.target.z / 4) * 4); sun.position.copy(sun.target.position).addScaledVector(sunDir, 120);
      waterN.offset.x = t * .004; waterN.offset.y = t * .0025;
      flame.scale.set(1 + Math.sin(t * 14) * .15, 1 + Math.sin(t * 11) * .25, 1); fire.intensity = 5.5 + Math.sin(t * 17) * 1.2;
      ctl.update(); renderer.render(scene, camera);
      mt += dt; if (mt > .15) { mt = 0; drawMap(mini, false); if (mapEl.classList.contains('on')) drawMap(mc, true); const n = nameAt(ctl.target.x, ctl.target.z); if (n !== lastLoc) { lastLoc = n; locEl.textContent = n } }
    }
    loop();
    const ld = document.getElementById('ld'); setTimeout(() => { ld.style.opacity = 0; setTimeout(() => ld.remove(), 900) }, 500);
  </script>
