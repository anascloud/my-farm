  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

    const T = Math.PI * 2; let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;

    /* ===== WORLD: island layout follows the Island Castaway reference map ===== */

    /* ===== REALISTIC PROCEDURAL TEXTURE LIBRARY ===== */

    const leafTex = noiseTex('#3f6d24', ['#2c4d18', '#55882e', '#6fa03a', '#24421a'], 1600, 2);

      const [c, g] = cnv(64, 128);
